<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanka Chat</title>
<meta name="theme-color" content="#17110e">
<meta name="description" content="Kankalarınla sohbet, sesli odalar ve daha fazlası">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanka">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17110e; --panel: #211915; --card: #2b211c; --hover: #33271f; --line: #3a2c24;
    --ink: #f4e6d8; --muted: #b49c89;
    --accent: #ff8a4c; --accent-2: #ffb347; --accent-soft: #3d2a20;
    --mine: linear-gradient(135deg, #f26b3a, #ff8f5a);
    --other: #2e231d; --green: #6fd39b; --red: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font: inherit; color: inherit; }
  a { color: var(--accent-2); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  /* ---------- Giriş ---------- */
  #auth { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, rgba(255,138,76,.18) 0, transparent 40%), radial-gradient(circle at 80% 80%, rgba(255,179,71,.12) 0, transparent 40%), var(--bg); }
  #auth .card { background: var(--panel); width: 400px; padding: 36px; border-radius: 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); border: 1px solid var(--line); }
  .logo { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; background: var(--mine); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 36px; transform: rotate(-6deg); }
  #auth h1 { font-size: 28px; font-weight: 800; }
  #auth p { color: var(--muted); margin: 6px 0 20px; }
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .field { width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); outline: none; font-size: 15px; margin-bottom: 10px; }
  .field:focus { border-color: var(--accent); }
  .primary { width: 100%; padding: 13px; border-radius: 14px; background: var(--mine); color: #fff; font-weight: 800; font-size: 16px; margin-top: 4px; }
  #auth-err { color: var(--red); font-weight: 700; min-height: 22px; margin-top: 10px; font-size: 14px; }

  /* ---------- Yerleşim ---------- */
  #app { display: flex; height: 100vh; padding: 16px; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; }

  #rail { width: 76px; flex-shrink: 0; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; }
  .srv { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); font-weight: 800; font-size: 17px; transition: all .15s; position: relative; flex-shrink: 0; }
  .srv:hover { border-radius: 16px; border-color: var(--accent-2); }
  .srv.active { border-radius: 16px; background: var(--accent); border-color: var(--accent); color: #fff; }
  .srv.home { background: var(--mine); border: none; color: #fff; font-size: 22px; border-radius: 16px; }
  .srv.dash { border-style: dashed; color: var(--accent); font-size: 20px; }
  .srv .dot { position: absolute; right: -2px; top: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); border: 3px solid var(--panel); }
  .rsep { width: 30px; height: 2px; background: var(--line); border-radius: 2px; flex-shrink: 0; }

  #side { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  .shead { padding: 18px 16px 6px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .shead h3 { font-weight: 800; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 14px 20px 6px; display: flex; justify-content: space-between; align-items: center; }
  .label button { width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 800; line-height: 1; }
  #side-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .room { display: flex; align-items: center; gap: 10px; margin: 1px 10px; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .room .ico { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .room:hover { background: var(--hover); color: var(--ink); }
  .room.active { background: var(--card); color: var(--ink); }
  .room.active .ico { background: var(--mine); }
  .room.unread { color: var(--ink); }
  .room.unread::after { content: ''; margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .vusers { margin: 0 10px 4px 52px; }
  .vuser { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 3px 0; }
  .vuser .av { width: 22px; height: 22px; font-size: 10px; border-width: 2px; }

  #me { margin: 10px; padding: 10px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  #me .row1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #me .row1 > div:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; }
  #me .n, #me .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #me .s .act-line { display: flex; min-width: 0; }
  #me .s .act-line { font-size: 0; gap: 5px; } /* dar panelde sadece oyun adı */
  #me .s .act-line b { min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  #me .ibtn { flex-shrink: 0; }
  #me .n { font-weight: 800; }
  #me .s { font-size: 12px; color: var(--muted); font-weight: 700; }
  #me .ibtn { margin-left: auto; }
  #voicebar { display: none; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  #voicebar .vt { font-size: 13px; font-weight: 800; color: var(--green); }
  #voicebar .vc { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #voicebar .btns { display: flex; gap: 6px; }
  #voicebar .btns button { flex: 1; padding: 7px; border-radius: 10px; background: var(--hover); font-weight: 800; font-size: 13px; }
  #voicebar .btns .leave { background: #4a2020; color: #ffb3b3; }
  .ibtn { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .ibtn:hover { background: var(--hover); color: var(--ink); }

  .av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; flex-shrink: 0; border: 3px solid var(--panel); position: relative; }
  .lvl { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); margin-left: 6px; vertical-align: middle; }

  /* ---------- Sohbet ---------- */
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
  #head { padding: 16px 20px 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); min-height: 70px; }
  #head h2 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #head h2 .ic { color: var(--accent); width: 20px; height: 20px; }
  .xox button .ic { width: 28px; height: 28px; }
  .sys .ic { width: 14px; height: 14px; margin-right: 6px; }
  #head small { color: var(--muted); font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 2px; }
  .hello { text-align: center; color: var(--muted); margin: 20px 0 24px; }
  .hello .big { font-size: 44px; }
  .hello b { color: var(--ink); display: block; font-size: 18px; margin: 4px 0; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty .big { font-size: 52px; margin-bottom: 8px; }

  /* Mesajlar */
  .day { display: flex; align-items: center; gap: 12px; margin: 18px 0 8px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .04em; }
  .day::before, .day::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .row { display: flex; gap: 10px; align-items: flex-start; position: relative; padding: 2px 0; }
  .row:not(.cont) { margin-top: 14px; }
  .row .av { width: 36px; height: 36px; font-size: 14px; border: none; margin-top: 2px; }
  .row.cont .av, .row.mine .av { display: none; }
  .row .col { display: flex; flex-direction: column; align-items: flex-start; max-width: min(68%, 560px); min-width: 0; }
  .row.mine { justify-content: flex-end; }
  .row.mine .col { align-items: flex-end; }
  .row.cont:not(.mine) .col { margin-left: 46px; }
  .who { font-size: 13px; font-weight: 800; margin: 0 0 4px 4px; display: flex; align-items: baseline; gap: 6px; }
  .who .t { font-size: 11px; color: var(--muted); font-weight: 600; }
  .bubble { position: relative; padding: 8px 14px 8px; border-radius: 18px; background: var(--other); white-space: pre-wrap; word-break: break-word; line-height: 1.45; font-size: 15px; }
  .row:not(.mine):not(.cont) .bubble { border-top-left-radius: 6px; }
  .row.mine .bubble { background: var(--mine); color: #fff; }
  .row.mine:not(.cont) .bubble { border-top-right-radius: 6px; }
  .bubble .stamp { float: right; margin: 6px 0 -4px 10px; font-size: 10.5px; opacity: .6; font-weight: 600; white-space: nowrap; }
  .row.mine .bubble a { color: #fff; }
  .bubble .mention { background: rgba(255,179,71,.18); color: var(--accent-2); border-radius: 6px; padding: 0 4px; font-weight: 800; }
  .row.mine .bubble .mention { background: rgba(255,255,255,.22); color: #fff; }
  .bubble img { display: block; max-width: 100%; max-height: 280px; border-radius: 12px; margin: 2px -8px 4px; cursor: zoom-in; }
  .bubble.only-img { padding: 6px; background: transparent !important; }
  .bubble.only-img img { margin: 0; }
  .rref { position: relative; display: flex; align-items: center; gap: 6px; max-width: 100%; margin: 0 0 4px 4px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .rref:hover { color: var(--ink); }
  .rref .mini { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rref b { font-weight: 800; flex-shrink: 0; }
  .rref .txt { overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  .row:not(.mine) .rref::before { content: ''; position: absolute; left: -32px; top: 8px; width: 26px; height: 12px; border-left: 2px solid #5c463a; border-top: 2px solid #5c463a; border-top-left-radius: 8px; }
  .row.mine .rref { margin: 0 4px 4px 0; }
  .row.mine .rref::after { content: ''; position: absolute; right: -16px; top: 8px; width: 12px; height: 12px; border-right: 2px solid #5c463a; border-top: 2px solid #5c463a; border-top-right-radius: 8px; }
  .row.reply .av { margin-top: 24px; }
  .row.flash .bubble, .row.flash .kcard { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent-2); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .quote { font-size: 12.5px; padding: 6px 10px; border-left: 3px solid var(--accent-2); background: rgba(0,0,0,.2); border-radius: 8px; margin: 2px 0 6px; opacity: .9; }
  .quote b { display: block; font-size: 12px; }
  .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .reacts button { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 800; color: var(--muted); }
  .reacts button.on { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }
  .reacts button:hover { border-color: var(--accent-2); }
  .row:hover .bubble, .row.hl .bubble { filter: brightness(1.08); }
  .row.hl { background: rgba(255,179,71,.06); border-radius: 12px; }

  /* Mesaj araç çubuğu */
  .tools { position: absolute; top: -14px; display: flex; gap: 1px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2px; z-index: 3; box-shadow: 0 6px 16px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .12s; }
  .row:not(.mine) .tools { right: 8px; } .row.mine .tools { left: 8px; }
  .row:hover .tools, .row.hl .tools { opacity: 1; pointer-events: auto; }
  .tools button { width: 30px; height: 28px; border-radius: 7px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .tools button:hover { background: var(--hover); color: var(--ink); }
  .tools svg { width: 17px; height: 17px; }
  .pop { position: fixed; z-index: 25; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .pop.emo { display: flex; gap: 2px; }
  .pop.emo button { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; transition: transform .1s; }
  .pop.emo button:hover { background: var(--hover); transform: scale(1.15); }
  .pop.more button { display: flex; align-items: center; gap: 10px; width: 170px; padding: 9px 12px; border-radius: 9px; font-weight: 700; text-align: left; }
  .pop.more button:hover { background: var(--hover); }
  .pop.more .danger { color: var(--red); }
  .sys { align-self: center; margin: 12px 0; padding: 5px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-2); font-weight: 800; font-size: 12.5px; }

  .kcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; width: 300px; max-width: 100%; }
  .kcard .kt { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
  .kcard h4 { font-size: 17px; margin: 4px 0 2px; }
  .kcard .sub { color: var(--muted); font-size: 13px; font-weight: 700; }
  .kcard .act { margin-top: 10px; width: 100%; padding: 9px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 800; }
  .kcard .act.on { background: var(--mine); color: #fff; }
  .going { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .going span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--hover); font-weight: 700; }
  .opt { position: relative; display: block; width: 100%; text-align: left; margin-top: 6px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; font-weight: 700; }
  .opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); z-index: 0; transition: width .3s; }
  .opt.on { border-color: var(--accent); }
  .opt span { position: relative; z-index: 1; display: flex; justify-content: space-between; }

  #typing { height: 22px; padding: 0 28px; font-size: 13px; color: var(--muted); font-weight: 600; }
  #replybar { display: none; margin: 0 20px; padding: 8px 14px; border-radius: 14px 14px 0 0; background: var(--card); border: 1px solid var(--line); border-bottom: none; font-size: 13px; color: var(--muted); justify-content: space-between; align-items: center; }
  #replybar b { color: var(--ink); }
  #compose { margin: 0 20px 20px; display: flex; gap: 6px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 6px; position: relative; }
  #compose:focus-within { border-color: var(--accent-2); }
  #input { flex: 1; border: none; outline: none; background: none; font-size: 15px; padding: 0 6px; }
  #send { width: 44px; height: 44px; border-radius: 14px; background: var(--mine); color: #fff; font-size: 18px; flex-shrink: 0; }
  #plus { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 22px; font-weight: 800; flex-shrink: 0; }
  #menu { display: none; position: absolute; bottom: 58px; left: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 5; }
  #menu button { display: flex; gap: 10px; align-items: center; width: 210px; padding: 10px 12px; border-radius: 10px; font-weight: 700; text-align: left; }
  #menu button:hover { background: var(--hover); }
  #suggest { display: none; position: absolute; bottom: 58px; left: 50px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; z-index: 5; }
  #suggest button { display: flex; align-items: center; gap: 8px; width: 200px; padding: 7px 10px; border-radius: 10px; font-weight: 700; }
  #suggest button:hover, #suggest button.sel { background: var(--hover); }
  #suggest .av { width: 24px; height: 24px; font-size: 11px; border-width: 2px; }
  #drop { display: none; position: absolute; inset: 0; background: rgba(23,17,14,.85); border: 3px dashed var(--accent); border-radius: 24px; z-index: 6; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: var(--accent); }

  /* ---------- Üyeler ---------- */
  #members { width: 230px; flex-shrink: 0; padding: 6px 10px; overflow-y: auto; }
  .mem { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 14px; font-weight: 700; cursor: pointer; }
  .mem:hover { background: var(--hover); }
  .mem.off { opacity: .45; }
  .on-dot::after { content: ''; position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid var(--panel); }

  /* ---------- Modal / bildirim ---------- */
  #modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); align-items: center; justify-content: center; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 26px; width: 440px; max-height: 80vh; overflow-y: auto; }
  #modal h3 { font-size: 20px; margin-bottom: 4px; }
  #modal .hint { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #modal .rowb { display: flex; gap: 8px; margin-top: 10px; }
  #modal .rowb button { flex: 1; padding: 12px; border-radius: 14px; font-weight: 800; background: var(--card); }
  #modal .rowb .primary { margin: 0; }
  .song { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--card); margin-bottom: 6px; }
  .song .n { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
  .song a { font-weight: 800; text-decoration: none; word-break: break-all; }
  .song small { display: block; color: var(--muted); }
  #toasts { position: fixed; right: 20px; bottom: 20px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--card); border: 1px solid var(--accent); border-radius: 16px; padding: 12px 16px; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,.5); cursor: pointer; animation: pop .2s ease-out; }
  .toast b { color: var(--accent-2); }
  .toast small { display: block; color: var(--muted); font-size: 12px; }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } }
  #viewer { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.85); align-items: center; justify-content: center; cursor: zoom-out; }
  #viewer img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }

  .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .srv img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
  .srv { overflow: visible; } .srv img { display: block; }
  .mem .info { min-width: 0; display: flex; flex-direction: column; }
  .mem .st { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-admin { color: #ffcf5c !important; } .role-mod { color: #7ec8ff !important; }
  .badge { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
  .badge.admin { background: #4a3a14; color: #ffcf5c; } .badge.mod { background: #16344a; color: #7ec8ff; }
  .hbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .hbtn:hover { border-color: var(--accent-2); }
  #menu-btn { display: none; }
  .prof { text-align: center; }
  .prof .big { width: 96px; height: 96px; font-size: 38px; margin: 0 auto 10px; border: 4px solid var(--card); }
  .prof h3 { margin-bottom: 2px; }
  .prof .st { color: var(--muted); margin: 6px 0 14px; font-weight: 600; }

  /* ================= Animasyonlar ================= */
  :root { --ease: cubic-bezier(.2,.9,.3,1.2); --ease-out: cubic-bezier(.16,1,.3,1); }

  }

    if (t === 'notif') $('#st-main').querySelectorAll('input[name=ns]').forEach(r => r.onchange = () => { setNS(r.value); toast('Gürültü engelleme ayarlandı'); });
    if (t === 'act') {

// ================= Kenar şerit =================
function renderRail() {
  window.kankaDesktop?.badge(S.unread.size + (S.unreadDM ? 1 : 0));
  $('#rail').innerHTML =
    `<button class="srv home ${S.view === 'dm' ? 'active' : ''}" id="home" title="Arkadaşlar ve özel mesajlar">${ic('logo')}${S.unreadDM ? '<span class="dot"></span>' : ''}</button><div class="rsep"></div>` +
    S.servers.map(s => `<button class="srv ${S.view === 'server' && s.id === S.server?.id ? 'active' : ''}" data-id="${s.id}" title="${esc(s.name)}${mutedServers.has(s.id) ? ' (sessizde)' : ''}">${s.iconImg ? `<img src="${esc(s.iconImg)}" alt="">` : esc(s.icon)}${S.unreadServers.has(s.id) ? '<span class="dot"></span>' : ''}</button>`).join('') +
    `<button class="srv dash" id="add-srv" title="Sunucu oluştur" aria-label="Sunucu oluştur">${ic('plus')}</button><button class="srv dash" id="join-srv" title="Davet koduyla katıl" aria-label="Davet koduyla katıl">${ic('link')}</button>`;
  $('#home').onclick = openDMHome;
  $('#rail').querySelectorAll('.srv[data-id]').forEach(b => b.onclick = () => selectServer(b.dataset.id));
  $('#add-srv').onclick = () => form('Yeni sunucu', 'Arkadaşlarınla takılacağın yeni bir yer aç.', [{ k: 'name', p: 'Sunucu adı' }], v =>
    socket.emit('createServer', v.name, s => s.error ? toast(s.error) : selectServer(s.id)));
  $('#join-srv').onclick = () => form('Sunucuya katıl', 'Arkadaşının gönderdiği davet linkini ya da kodunu yapıştır.', [{ k: 'code', p: 'Davet linki ya da kodu' }], v => joinInvite(v.code));
}
async function invitePreview(code) {
  try { const r = await fetch('/api/davet/' + encodeURIComponent(code)); return await r.json(); } catch { return { error: 'Davet okunamadı' }; }
}
const inviteHTML = p => `<div class="invite-prev"><div class="si">${p.iconImg ? `<img src="${esc(p.iconImg)}" alt="">` : esc(p.icon)}</div><div><small>Sunucuya davet edildin</small><b style="font-size:17px">${esc(p.name)}</b><small><span class="on"></span>${p.online} çevrimiçi · ${p.members} üye</small></div></div>`;
(async () => {
  const code = new URLSearchParams(location.search).get('davet'); if (!code) return;
  const p = await invitePreview(code);
  if (p.error) return;
  $('#auth-form .logo').insertAdjacentHTML('afterend', inviteHTML(p));
  $('#auth-form h1').textContent = 'Sana bir yer ayrıldı';
  $('#auth-form > p').textContent = 'Hesap aç ya da giriş yap, sunucuya kendiliğinden katılırsın.';
})();
async function joinInvite(code) {
  const p = await invitePreview(code);
  if (p.error) return toast(p.error);
  const have = S.servers.find(x => x.invite === code);
  if (have) return selectServer(have.id);
  modal(`${inviteHTML(p)}<div class="rowb"><button id="mx">Vazgeç</button><button class="primary" id="inv-join">Sunucuya katıl</button></div>`);
  $('#mx').onclick = closeModal;
  $('#inv-join').onclick = () => { closeModal(); joinInviteNow(code); };
}
function joinInviteNow(code) {
  socket.emit('joinInvite', code, s => {
    if (s.error) return toast(s.error);
    if (!S.servers.find(x => x.id === s.id)) S.servers.push(s);
    selectServer(s.id); toast(`${s.name} sunucusuna katıldın`);
  });
}

// ================= Sunucu görünümü =================
function selectServer(id, channelId) {
  closeSrvMenu();
  S.view = 'server';
  S.server = S.servers.find(s => s.id === id) || S.servers[0];
  S.unreadServers.delete(S.server.id);
  const text = S.server.channels.filter(c => c.type !== 'voice');
  const ch = text.find(c => c.id === channelId) || text[0];
  renderRail(); renderMembers();
  if (ch) selectChannel(ch.id); else renderSide();
}
function renderSide() {
  if (S.view === 'dm') return renderDMSide();
  const s = S.server;
  $('#side-head').className = 'shead srvbtn';
  $('#side-head').setAttribute('role', 'button'); $('#side-head').tabIndex = 0;
  $('#side-head').innerHTML = `<h3>${esc(s.name)}</h3><button class="hinv" id="sh-inv" title="İnsanları davet et" aria-label="İnsanları davet et">${ic('userplus')}</button>${ic('chevron', 'chev')}`;
  $('#sh-inv').onclick = e => { e.stopPropagation(); showInvite(s); };
  $('#side-head').onclick = e => { e.stopPropagation(); toggleSrvMenu(); };
  $('#side-head').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSrvMenu(); } };
  const canAdd = !(s.customRoles?.length) || perm(s, 'manageChannels');
  const lock = c => c.private ? ic('lock', 'lockic') : c.readonly ? ic('megaphone', 'lockic') : '';
  const tRow = c => `<div class="room ${c.id === S.channel?.id ? 'active' : ''} ${S.unread.has(c.id) ? 'unread' : ''}" data-id="${c.id}"><div class="ico">${roomIcon(c)}</div>${esc(c.name)}${lock(c)}</div>`;
  const vRow = c => `<div class="room vroom ${myVoice === c.id ? 'active' : ''}" data-id="${c.id}"><div class="ico">${ic('volume')}</div>${esc(c.name)}${lock(c)}</div>` +
      `<div class="vusers">${(S.voice[c.id] || []).map(n => `<div class="vuser ${speaking.has(n) ? 'speaking' : ''}" data-vu="${esc(n)}">${av(n)}${esc(n)}${(S.live?.[c.id] || []).includes(n) ? `<span class="livebadge" data-live="${esc(n)}" data-ch="${c.id}" title="Yayını izle">CANLI</span>` : ''}</div>`).join('')}</div>`;
  const row = c => c.type === 'voice' ? vRow(c) : tRow(c);
  const free = s.channels.filter(c => !c.category), text = free.filter(c => c.type !== 'voice'), voiceCh = free.filter(c => c.type === 'voice');
  const cats = [...new Set(s.channels.map(c => c.category).filter(Boolean))];
  const shut = new Set(JSON.parse(store.get('kanka-cats') || '[]'));
  $('#side-list').innerHTML =
    (text.length || canAdd ? `<div class="label">Yazılı odalar ${canAdd ? '<button data-t="text" title="Oda ekle">+</button>' : ''}</div>` + text.map(row).join('') : '') +
    (voiceCh.length || canAdd ? `<div class="label">Sesli odalar ${canAdd ? '<button data-t="voice" title="Sesli oda ekle">+</button>' : ''}</div>` + voiceCh.map(row).join('') : '') +
    cats.map(cat => { const k = s.id + '|' + cat, closed = shut.has(k), list = s.channels.filter(c => c.category === cat);
      return `<div class="label cat-label ${closed ? 'shut' : ''}" data-cat="${esc(k)}">${ic('chevron')}${esc(cat)}</div>` + list.filter(c => !closed || c.id === S.channel?.id || c.id === myVoice).map(row).join(''); }).join('');
  $('#side-list').querySelectorAll('[data-cat]').forEach(l => l.onclick = () => { const k = l.dataset.cat; shut.has(k) ? shut.delete(k) : shut.add(k); store.set('kanka-cats', JSON.stringify([...shut])); renderSide(); });
  $('#side-list').querySelectorAll('.room[data-id]:not(.vroom)').forEach(d => d.onclick = () => selectChannel(d.dataset.id));
  $('#side-list').querySelectorAll('.vroom').forEach(d => d.onclick = () => joinVoice(d.dataset.id));
  $('#side-list').querySelectorAll('[data-live]').forEach(b => b.onclick = e => {
    e.stopPropagation(); const n = b.dataset.live;
    if (myVoice === b.dataset.ch) { const sid = Object.keys(peers).find(k => peerNames[k] === n); if (sid) watchStream(sid); }
    else { autoWatch = n; joinVoice(b.dataset.ch); }
  });
  $('#side-list').querySelectorAll('.label button').forEach(b => b.onclick = () => {
    const voiceRoom = b.dataset.t === 'voice';
    form(voiceRoom ? 'Yeni sesli oda' : 'Yeni oda', voiceRoom ? 'Arkadaşlarınla sesli konuşacağınız oda.' : 'Yeni bir sohbet odası aç.', [{ k: 'name', p: 'Oda adı' }], v =>
      socket.emit('createChannel', { serverId: s.id, name: v.name, type: b.dataset.t }, c => c.error ? toast(c.error) : !voiceRoom && selectChannel(c.id)));
  });
}
// ---- Yazmaya başlayınca mesaj kutusuna odaklan (Discord gibi) ----
document.addEventListener('keydown', e => {
  const inp = $('#input');
  if (!inp || inp.disabled || document.activeElement === inp) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  if (e.key.length !== 1 && e.key !== 'Backspace') return;              // sadece yazı tuşları (oklar, F tuşları, Esc vb. değil)
  if (e.key === ' ' && document.activeElement?.closest('button, [role=button], a')) return;
  if (typingTarget(e) || document.activeElement?.isContentEditable) return;
  if ($('#modal').classList.contains('open') || $('.umenu') || $('#statusmenu') || $('#srvmenu')) return;

function openDM(name) {
  if (name === S.me) return;
  socket.emit('openDM', name, r => {
    if (r.error) return toast(r.error);
    S.view = 'dm'; renderRail();
    if (!S.dms.find(d => d.id === r.id)) S.dms.unshift({ id: r.id, with: r.with, last: Date.now() });
    closeModal();
    openDMChannel(r.id, r.with);
  });
}
function openChat(id, other) {

  openDMChannel(id, other || id.slice(3).split('|').find(n => n !== S.me) || S.me);
}

  renderDMSide(); renderMembers();
}

function msgHTML(m, prev) {

  if (m.kind === 'daily') return day + `<div class="daily" data-id="${m.id}"><div class="kt">${ic('sun')}GÜNÜN SORUSU</div><p>${esc(m.text)}</p></div>`;

  const lvl = S.users[m.author] ? `<span class="lvl">Sv ${S.users[m.author].level}</span>` : '';

  let body;
  if (m.kind === 'plan') {
    const on = m.plan.going.includes(S.me);
    body = `<div class="kcard"><div class="kt">${ic('calendar')}Plan</div><h4>${esc(m.plan.title)}</h4><div class="sub">${esc(m.plan.when || 'Zaman belirtilmedi')}</div>
      <div class="going">${m.plan.going.map(n => `<span>${esc(n)}</span>`).join('')}</div>

      }).join('') + `<div class="sub" style="margin-top:8px">${total} oy</div></div>`;
  } else if (m.kind === 'dice') {
    body = `<div class="kcard"><div class="kt">${ic('dice')}Zar (${m.game.sides} yüzlü)</div><div class="game-res">${m.game.result}</div></div>`;

$('#messages').addEventListener('scroll', () => {
  const box = $('#messages');
  if (!histMore || histBusy || box.scrollTop > 120 || !S.msgs.length || !S.channel) return;
  histBusy = true; const ch = S.channel.id;
  $('#loadmore') && ($('#loadmore').textContent = 'Eski mesajlar yükleniyor…');
  socket.emit('history', { before: S.msgs[0].id }, r => {
    histBusy = false;
    if (S.channel?.id !== ch) return;

  const vp = e.target.closest('[data-vplay]'); if (vp) return playVoice(vp.dataset.vplay);

  const j = e.target.closest('.rref');
  if (j) {
    const row = document.querySelector(`.row[data-id="${j.dataset.jump}"]`);

    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    return;
  }
  const t = e.target.closest('button, img[data-view]');
  if (!t) return;
  const find = id => S.msgs.find(m => m.id === id);
  if (t.dataset.react) socket.emit('react', { msgId: t.dataset.react, emoji: t.dataset.e });
  else if (t.dataset.emo) openPop(t, 'emo', EMOJIS.map(e => `<button data-e="${e}" aria-label="${e} tepkisi">${e}</button>`).join(''),
    b => socket.emit('react', { msgId: t.dataset.emo, emoji: b.dataset.e }));
  else if (t.dataset.reply) startReply(find(t.dataset.reply));
  else if (t.dataset.more) {
    const m = find(t.dataset.more), mine = m.author === S.me;
    const canDel = mine || (S.view === 'server' && isMod(S.server, S.me));
    const canPin = S.view === 'dm' || isMod(S.server, S.me);
    openPop(t, 'more',
      `<button data-a="reply">${ic('reply')}Yanıtla</button>` + `<button data-a="thread">${ic('thread')}Konu başlat</button>` +
      (m.text ? `<button data-a="copy">${ic('copy')}Metni kopyala</button>` : '') +
      (canPin ? `<button data-a="pin">${ic('pin')}${m.pinned ? 'Sabitlemeyi kaldır' : 'Sabitle'}</button>` : '') +
      (mine && m.kind === 'text' && m.text ? `<button data-a="edit">${ic('edit')}Düzenle</button>` : '') +
      (canDel ? `<button data-a="del" class="danger">${ic('trash')}Sil</button>` : ''),
      b => {
        const a = b.dataset.a;
        if (a === 'reply') startReply(m);
        if (a === 'pin') socket.emit('pin', m.id);
        if (a === 'thread') openThread(m.id);
        if (a === 'copy') navigator.clipboard?.writeText(m.text).then(() => toast('Kopyalandı'));
        if (a === 'edit') form('Mesajı düzenle', '', [{ k: 'text', p: 'Mesaj', v: m.text }], v => socket.emit('edit', { msgId: m.id, text: v.text }));

      });

  else if (t.dataset.plan) socket.emit('planToggle', t.dataset.plan);
  else if (t.dataset.poll) socket.emit('vote', { msgId: t.dataset.poll, index: +t.dataset.i });

socket.on('message', ({ channelId, msg }) => {
  if (channelId !== S.channel?.id) return;
  if (msg.author && msg.author !== S.me && !document.hasFocus() && !isDnd() && !(S.view === 'server' && mutedServers.has(S.server?.id))) playSound('msg');
  typers.delete(msg.author); renderTyping();
  S.msgs.push(msg);
  if (document.hasFocus()) markRead(channelId);
  const box = $('#messages');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.insertAdjacentHTML('beforeend', msgHTML(msg, S.msgs[S.msgs.length - 2]));
  box.querySelector(`.row[data-id="${msg.id}"]`)?.classList.add('new');
  if (atBottom || msg.author === S.me) box.scrollTop = box.scrollHeight;
});
socket.on('update', ({ channelId, msg }) => {
  if (channelId !== S.channel?.id) return;
  const i = S.msgs.findIndex(m => m.id === msg.id);
  if (i >= 0) {
    const before = JSON.stringify(S.msgs[i].reactions || {});
    S.msgs[i] = msg; renderMessages();
    if (openThreadId === msg.id) renderThread();
    if (before !== JSON.stringify(msg.reactions || {})) document.querySelectorAll(`.row[data-id="${msg.id}"] .reacts button`).forEach(b => b.classList.add('bump'));
  }
});
socket.on('remove', ({ channelId, msgId }) => {
  if (channelId !== S.channel?.id) return;
  S.msgs = S.msgs.filter(m => m.id !== msgId); renderMessages();
});
socket.on('playlist', ({ channelId, playlist }) => { if (channelId === S.channel?.id) S.playlist = playlist; });

// ================= Yazma alanı =================
function send(payload) {
  if (S.replyTo) payload.replyTo = S.replyTo.id;
  socket.emit('message', payload, r => r?.error ? toast(r.error) : cancelReply());
}
$('#compose').onsubmit = e => {
  e.preventDefault();
  if (pickSuggestion()) return;
  const text = $('#input').value.trim();
  if (!text) return;
  $('#input').value = ''; hideSuggest();
  const [cmd, ...rest] = text.split(' '); const arg = rest.join(' ');
  const parts = arg.split('|').map(s => s.trim()).filter(Boolean);
  if (cmd === '/plan') return send({ kind: 'plan', title: parts[0], when: parts[1] });
  if (cmd === '/anket') return send({ kind: 'poll', question: parts[0], options: parts.slice(1) });
  if (cmd === '/şarkı' || cmd === '/sarki') return send({ kind: 'song', title: arg });
  if (cmd === '/zar') return send({ kind: 'dice', sides: parseInt(arg) || 6 });
  if (cmd === '/yazitura' || cmd === '/yazıtura') return send({ kind: 'coin' });
  if (cmd === '/xox') return send({ kind: 'xox' });
  if (cmd === '/izle') return arg ? socket.emit('watchSet', arg) : startWatch();
  send({ kind: 'text', text });
};
function startReply(m) {
  if (!m) return;
  S.replyTo = m;
  $('#reply-who').textContent = m.author;
  $('#reply-text').textContent = (m.text || m.plan?.title || m.poll?.question || m.song?.title || 'görsel').slice(0, 60);
  $('#replybar').style.display = 'flex'; $('#input').focus();
}
function cancelReply() { S.replyTo = null; $('#replybar').style.display = 'none'; }
$('#reply-x').onclick = cancelReply;

    v => send({ kind: 'poll', question: v.question, options: [v.o1, v.o2, v.o3, v.o4] }));

  if (a === 'xox') send({ kind: 'xox' });
  if (a === 'song') form(`${ic('music')}Şarkı ekle`, 'YouTube/Spotify linki ya da şarkının adını yaz.', [{ k: 'title', p: 'Link ya da şarkı adı' }], v => send({ kind: 'song', title: v.title }));
};

// Resim
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadImage(f); };
function uploadImage(f) {
  if (!f.type.startsWith('image/')) return toast('Sadece resim gönderebilirsin');
  if (f.size > 5 * 1024 * 1024) return toast('Resim en fazla 5 MB olabilir');
  const r = new FileReader();
  r.onload = () => socket.emit('upload', { data: r.result }, res => {
    if (res.error) return toast(res.error);
    const text = $('#input').value.trim(); $('#input').value = '';
    send({ kind: 'text', text, image: res.url });
  });
  r.readAsDataURL(f);
}

// @etiket önerileri
let sugg = [], suggI = 0;
function hideSuggest() { sugg = []; $('#suggest').style.display = 'none'; }
function renderSuggest() {
  if (!sugg.length) return hideSuggest();
  $('#suggest').innerHTML = sugg.map((n, i) => `<button type="button" class="${i === suggI ? 'sel' : ''}" data-n="${esc(n)}">${av(n)}${esc(n)}</button>`).join('');
  $('#suggest').style.display = 'block';
  $('#suggest').querySelectorAll('button').forEach(b => b.onclick = () => { suggI = sugg.indexOf(b.dataset.n); pickSuggestion(); });
}
function pickSuggestion() {
  if (!sugg.length) return false;
  const inp = $('#input'), pos = inp.selectionStart, before = inp.value.slice(0, pos).replace(/@[\p{L}\p{N}_.-]*$/u, '@' + sugg[suggI] + ' ');
  inp.value = before + inp.value.slice(pos); inp.setSelectionRange(before.length, before.length);
  hideSuggest(); inp.focus(); return true;
}
let lastTyping = 0;
$('#input').addEventListener('input', () => {
  if (Date.now() - lastTyping > 2000) { lastTyping = Date.now(); socket.emit('typing'); }
  const m = /@([\p{L}\p{N}_.-]*)$/u.exec($('#input').value.slice(0, $('#input').selectionStart));
  if (!m) return hideSuggest();
  const pool = S.view === 'server' ? S.server.members : (S.channel?.with ? [S.channel.with] : []);
  sugg = pool.filter(n => n !== S.me && n.toLowerCase().startsWith(m[1].toLowerCase())).slice(0, 6); suggI = 0;
  renderSuggest();
});
$('#input').addEventListener('keydown', e => {
  if (!sugg.length) { if (e.key === 'Escape') cancelReply(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); suggI = (suggI + (e.key === 'ArrowDown' ? 1 : sugg.length - 1)) % sugg.length; renderSuggest(); }
  if (e.key === 'Tab') { e.preventDefault(); pickSuggestion(); }
  if (e.key === 'Escape') hideSuggest();
});

  else names = S.server?.members || [];

    const o = S.online.has(n), r = roleOf(srv, n), u = S.users[n];

const lvlFloor = L => 5 * (L - 1) ** 2;

}

const NS_AI = { gt: ['/vendor/ns/gtcrn.js', ['/vendor/ns/gtcrn.wasm'], '@sapphi-red/web-noise-suppressor/gtcrn'], rnn: ['/vendor/ns/rnnoise.js', ['/vendor/ns/rnnoise_simd.wasm', '/vendor/ns/rnnoise.wasm'], '@sapphi-red/web-noise-suppressor/rnnoise'] };

function playVoice(id) {

let actx = null;

function playSound(kind) {
  if (!soundOn()) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const notes = { msg: [[880, 0, .08]], mention: [[660, 0, .1], [990, .11, .14]], join: [[523, 0, .1], [784, .1, .14]], leave: [[784, 0, .1], [523, .1, .14]], rec: [[1200, 0, .06]], reward: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .2]], ring: [[740, 0, .18], [880, .2, .18], [740, .5, .18], [880, .7, .18]] }[kind] || [];
    for (const [f, t, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      const st = actx.currentTime + t; g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.12, st + .01); g.gain.exponentialRampToValueAtTime(.0001, st + d);
      o.start(st); o.stop(st + d + .02);
    }
  } catch {}
}

  $('#watch-info').innerHTML = `${ic('tv')} ${esc(st.by)} başlattı · herkes senkron izliyor`;

    yt = new YT.Player('yt', { videoId: st.videoId, playerVars: { autoplay: 1, rel: 0, playsinline: 1 }, events: {

      onStateChange: e => {

$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function form(title, hint, fields, onOk) {
  modal(`<form id="mform"><h3>${title}</h3>${hint ? `<p class="hint">${hint}</p>` : '<div style="height:10px"></div>'}` +
    fields.map(f => `<input class="field" name="${f.k}" placeholder="${esc(f.p)}" value="${esc(f.v || '')}" ${f.opt ? '' : 'required'} autocomplete="off">`).join('') +
    `<div class="rowb"><button type="button" id="mx">Vazgeç</button><button class="primary" type="submit">Tamam</button></div></form>`);
  $('#mform input').focus();
  $('#mx').onclick = closeModal;
  $('#mform').onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(fields.map(f => [f.k, e.target[f.k].value.trim()]));
    closeModal(); onOk(v);
  };
}
function confirmBox(text, onOk) {
  modal(`<h3>Emin misin?</h3><p class="hint">${esc(text)}</p><div class="rowb"><button id="mx">Vazgeç</button><button class="primary" id="ok">Evet</button></div>`);
  $('#mx').onclick = closeModal; $('#ok').onclick = () => { closeModal(); onOk(); };
}
function toast(html, onClick, raw) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = raw ? html : esc(html);
  t.onclick = () => { t.remove(); onClick && onClick(); };
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 6000);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#viewer').style.display = 'none'; } });
</script>
