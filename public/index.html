<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Kanka Chat</title>
<meta name="theme-color" content="#17110e">
<meta name="description" content="Kankalarınla sohbet, sesli odalar ve daha fazlası">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanka">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17110e; --panel: #211915; --card: #2b211c; --hover: #33271f; --line: #3a2c24;
    --ink: #f4e6d8; --muted: #b49c89;
    --accent: #ff8a4c; --accent-2: #ffb347; --accent-soft: #3d2a20;
    --mine: linear-gradient(135deg, #f26b3a, #ff8f5a);
    --other: #2e231d; --green: #6fd39b; --red: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow: hidden; height: 100%; }
  body { font-family: 'Nunito', system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; overscroll-behavior: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font: inherit; color: inherit; }
  select, textarea { font: inherit; color: inherit; } select { color-scheme: dark; cursor: pointer; } select option { background: var(--card); color: var(--ink); } body.light select { color-scheme: light; }
  a { color: var(--accent-2); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }


  /* ================= YENİ ARAYÜZ (deneme): Ayarlar › Görünüm › Yeni arayüz ya da ?arayuz=yeni ================= */
  #side .livenow, #me-xp, .srv .rvc { display: none; }
  body.ui2:not(.light) { --bg: #0f0b09; --panel: #17110e; --card: #241b17; --hover: #2c221d; --line: rgba(255,232,214,.08); --other: #241b17; }
  body.ui2 #app { padding: 10px; gap: 10px; background: radial-gradient(900px 500px at 12% -10%, rgba(255,106,44,.10), transparent 60%), radial-gradient(700px 500px at 110% 110%, rgba(255,192,77,.05), transparent 60%), var(--bg); }
  body.ui2 .panel { border-radius: 26px; border: 1px solid var(--line); }
  body.ui2:not(.light) #chat { background: #1c1512; }
  body.ui2:not(.light) #rail { background: linear-gradient(180deg, #1a1310, #140f0c); }
  body.ui2 #rail { width: 76px; gap: 10px; }
  body.ui2 .srv { width: 52px; height: 52px; border-radius: 17px; border: none; background: var(--card); }
  body.ui2 .srv:hover { border-radius: 15px; }
  body.ui2 .srv.active { border-radius: 17px; outline: 2.5px solid var(--accent); outline-offset: 3px; background: var(--card); color: var(--ink); }
  body.ui2 .srv.home { box-shadow: 0 6px 18px rgba(255,106,44,.35); }
  body.ui2 .srv.home.active { outline-color: var(--ink); background: #F2652F; color: #fff; }
  body.ui2 .srv.dash { background: rgba(255,232,214,.04); border: 1.5px dashed rgba(255,232,214,.14); }
  body.ui2 .srv img { border-radius: inherit; }
  body.ui2 .srv .rvc { display: flex; position: absolute; right: -5px; bottom: -5px; height: 20px; min-width: 20px; padding: 0 5px; align-items: center; gap: 2px; border-radius: 10px; background: #3ddc97; color: #07261a; font-size: 11px; font-weight: 900; border: 3px solid #160f0c; z-index: 2; }
  body.ui2 .srv .rvc .ic { width: 11px; height: 11px; stroke-width: 2.6; }
  body.ui2 #side { width: 280px; }
  body.ui2 .room { border-radius: 12px; margin: 1px 10px; padding: 7px 9px; }
  body.ui2 .room .ico { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,232,214,.05); }
  body.ui2 .room.unread .ico { background: rgba(255,106,44,.13); color: var(--accent); }
  body.ui2 .room.active { background: #2c221d; }
  body.ui2 .room.active .ico { background: var(--accent); color: #fff; }
  body.ui2.light .room.active { background: var(--hover); }
  /* Şu an canlı */
  body.ui2 #side .livenow { display: block; padding: 4px 10px 2px; }
  body.ui2 .livenow .ln-h { display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px; font-size: 11.5px; font-weight: 900; letter-spacing: .07em; color: var(--muted); }
  body.ui2 .livenow .ln-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  body.ui2 .lcard { display: block; width: 100%; text-align: left; border-radius: 16px; padding: 10px 11px; margin-bottom: 6px; background: linear-gradient(135deg, rgba(61,220,151,.10), rgba(61,220,151,.03)); border: 1px solid rgba(61,220,151,.22); transition: transform .15s, border-color .15s; }
  body.ui2 .lcard:hover { transform: translateY(-1px); border-color: rgba(61,220,151,.45); }
  body.ui2 .lcard.me { background: linear-gradient(135deg, rgba(255,106,44,.16), rgba(255,106,44,.04)); border-color: rgba(255,106,44,.35); }
  body.ui2 .lcard .lt { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px; min-width: 0; }
  body.ui2 .lcard .lt > .ic { width: 16px; height: 16px; color: #3ddc97; flex-shrink: 0; } body.ui2 .lcard.me .lt > .ic { color: var(--accent); }
  body.ui2 .lcard .lt .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.ui2 .lcard .vtm { margin-left: auto; }
  body.ui2 .lcard.me .vtm { color: var(--accent); background: rgba(255,106,44,.14); }
  body.ui2 .lcard .ltag { flex-shrink: 0; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 6px; background: #ff5a5f; color: #fff; letter-spacing: .04em; }
  body.ui2 .lcard .who { display: flex; align-items: center; margin-top: 8px; min-width: 0; }
  body.ui2 .lcard .who .av { width: 26px; height: 26px; font-size: 11px; margin-right: -7px; border: 2.5px solid #1b1915; }
  body.ui2 .lcard .who .av.spk { box-shadow: 0 0 0 2px #3ddc97; }
  body.ui2 .lcard .who em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* alttaki profil kartı + XP çizgisi */
  body.ui2 #me { border-radius: 18px; margin: 10px; }
  body.ui2 #me-xp { display: block; height: 4px; border-radius: 3px; background: rgba(255,232,214,.08); overflow: hidden; margin-top: 9px; }
  body.ui2 #me-xp i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #ffc04d); }
  /* sohbet */
  body.ui2 #head { min-height: 64px; padding: 12px 16px 12px 20px; }
  body.ui2 #compose { border-radius: 20px; border: 1.5px solid rgba(255,232,214,.12); box-shadow: 0 10px 30px rgba(0,0,0,.25); margin: 0 18px 16px; }
  body.ui2.light #compose { border-color: var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  body.ui2 #send { border-radius: 14px; }
  body.ui2 #members { width: 270px; padding: 6px 12px; }
  @media (max-width: 760px) { body.ui2 #app { padding: 0; gap: 0; } body.ui2 .panel { border-radius: 0; } }

  /* ---------- Giriş ---------- */
  #auth { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 20%, rgba(255,138,76,.18) 0, transparent 40%), radial-gradient(circle at 80% 80%, rgba(255,179,71,.12) 0, transparent 40%), var(--bg); }
  #auth .card { background: var(--panel); width: 400px; padding: 36px; border-radius: 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); border: 1px solid var(--line); }
  .logo { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 22px; background: #F2652F; color: #fff; display: flex; align-items: center; justify-content: center; }
  .logo .klogo { width: 56px; height: 56px; }
  .ic.klogo { stroke: none; }
  #auth h1 { font-size: 28px; font-weight: 800; }
  #auth p { color: var(--muted); margin: 6px 0 20px; }
  .tabs { display: flex; background: var(--card); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .field { width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); outline: none; font-size: 15px; margin-bottom: 10px; }
  .field:focus { border-color: var(--accent); }
  .primary { width: 100%; padding: 13px; border-radius: 14px; background: var(--mine); color: #fff; font-weight: 800; font-size: 16px; margin-top: 4px; }
  #auth-err { color: var(--red); font-weight: 700; min-height: 22px; margin-top: 10px; font-size: 14px; }

  /* ---------- Yerleşim ---------- */
  #app { display: flex; height: 100vh; padding: 16px; gap: 16px; overflow: hidden; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; }

  #rail { width: 76px; flex-shrink: 0; padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; }
  .srv { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); font-weight: 800; font-size: 17px; transition: all .15s; position: relative; flex-shrink: 0; }
  .srv:hover { border-radius: 16px; border-color: var(--accent-2); }
  .srv.active { border-radius: 16px; background: var(--accent); border-color: var(--accent); color: #fff; }
  .srv.home { background: #F2652F; border: none; color: #fff; font-size: 22px; border-radius: 16px; }
  .srv.dash { border-style: dashed; color: var(--accent); font-size: 20px; }
  .srv .dot { position: absolute; right: -2px; top: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); border: 3px solid var(--panel); }
  .rsep { width: 30px; height: 2px; background: var(--line); border-radius: 2px; flex-shrink: 0; }

  #side { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  .shead { padding: 18px 16px 6px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .shead h3 { font-weight: 800; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 12px; white-space: nowrap; }
  .label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 14px 20px 6px; display: flex; justify-content: space-between; align-items: center; }
  .label button { width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 800; line-height: 1; }
  #side-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .room { display: flex; align-items: center; gap: 10px; margin: 1px 10px; padding: 8px 10px; border-radius: 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .room .ico { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .room:hover { background: var(--hover); color: var(--ink); }
  .room.active { background: var(--card); color: var(--ink); }
  .room.active .ico { background: var(--mine); }
  .room:not(.vroom):not(.active):not(.unread) { color: #a08a79; }
  .room:not(.vroom):not(.active):not(.unread) .ico { opacity: .72; }
  .room.unread { color: #fff; font-weight: 800; }
  .room.unread .ico { background: var(--accent); color: #1a0f0a; opacity: 1; }
  .room.unread:not(.has-ment)::after { content: ''; margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,138,76,.18); flex-shrink: 0; }
  #side-list .room.unread::before { content: ''; position: absolute; left: -10px; top: 50%; width: 4px; height: 10px; margin-top: -5px; border-radius: 0 4px 4px 0; background: #fff; }
  .mention[data-u] { cursor: pointer; } .mention[data-u]:hover { text-decoration: underline; }
  .chref { color: var(--accent-2); background: rgba(255,138,76,.12); padding: 0 4px; border-radius: 6px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .chref:hover { background: rgba(255,138,76,.25); }
  .rl-list { display: grid; gap: 6px; }
  .rl-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .rl-row.open { border-color: var(--accent); }
  .rl-row > button { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; } .rl-row > button:hover:not(:disabled) { background: var(--hover); color: var(--ink); } .rl-row > button:disabled { opacity: .3; }
  .rl-row > button .ic { width: 16px; height: 16px; }
  .rl-row .rl-ed { width: auto; padding: 0 12px; font-weight: 800; font-size: 13px; background: var(--hover); color: var(--ink); }
  .rl-row .rl-del:hover:not(:disabled) { color: var(--red); }
  .rl-eye.on { color: var(--accent) !important; background: var(--accent-soft) !important; }
  .rl-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 17px; background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .rl-ic i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); } .rl-ic.big { width: 48px; height: 48px; border-radius: 14px; font-size: 24px; } .rl-ic.big i { width: 16px; height: 16px; }
  .rl-t { flex: 1; min-width: 0; } .rl-t b { display: flex; align-items: center; gap: 6px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rl-t small { color: var(--muted); font-weight: 700; font-size: 12px; }
  .rl-ed-box { margin-top: 14px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--accent); }
  .rl-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .rl-head h4 { margin: 0; font-size: 18px; } .rl-head small { color: var(--muted); font-weight: 700; }
  .rl-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg); margin-bottom: 14px; } .rl-tabs button { flex: 1; padding: 8px; border-radius: 9px; font-weight: 800; font-size: 13px; color: var(--muted); } .rl-tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .rl-sw { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; } .rl-sw button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); } .rl-sw button.on { border-color: var(--ink); transform: scale(1.1); }
  .rl-sw input[type=color] { width: 34px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
  .rl-pg { margin-bottom: 12px; } .rl-pg h5 { display: flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; } .rl-pg h5 .ic { width: 14px; height: 14px; }
  .rl-perm { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; } .rl-perm:hover { background: var(--hover); }
  .rl-perm > span { flex: 1; min-width: 0; } .rl-perm b { display: block; font-size: 14px; } .rl-perm small { color: var(--muted); font-size: 12.5px; font-weight: 600; } .rl-perm.danger b { color: #ffb4a8; }
  .rl-perm input { position: absolute; opacity: 0; pointer-events: none; } .rl-perm .tg { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; flex-shrink: 0; transition: background .15s; }
  .rl-perm .tg::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; } .rl-perm input:checked + .tg { background: var(--accent); } .rl-perm input:checked + .tg::after { transform: translateX(16px); }
  .rl-perm input:disabled + .tg { opacity: .35; } .rl-perm:has(input:disabled) { cursor: not-allowed; }
  .rl-quick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 700; } .rl-quick button { padding: 5px 10px; border-radius: 8px; background: var(--hover); color: var(--ink); font-weight: 800; font-size: 12.5px; }
  .rm-list { display: grid; gap: 4px; max-height: 340px; overflow-y: auto; } .rm-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; } .rm-row:hover { background: var(--hover); } .rm-row.in { background: var(--accent-soft); }
  .rm-row .av { width: 32px; height: 32px; font-size: 13px; } .rm-row > span { flex: 1; min-width: 0; } .rm-row b { display: block; font-size: 14px; } .rm-row small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .rm-row button { padding: 6px 12px; border-radius: 9px; font-weight: 800; font-size: 12.5px; background: var(--accent); color: #1a0f0a; } .rm-row button.out { background: var(--hover); color: var(--ink); }
  .ricon { margin-left: 4px; font-size: 13px; }
  .tfa-card { padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .tfa-top { display: flex; gap: 12px; align-items: flex-start; } .tfa-top b { display: block; font-size: 15px; } .tfa-top span { color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.45; }
  .tfa-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--hover); color: var(--muted); flex-shrink: 0; } .tfa-ic.on { background: rgba(63,207,142,.15); color: #3fcf8e; } .tfa-ic .ic { width: 20px; height: 20px; }
  .tfa-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; } .danger-t { color: var(--red) !important; }
  .tfa-ask { text-align: center; } .tfa-ask .tfa-ic { margin: 0 auto 10px; width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); } .tfa-ask .tfa-ic.on { background: rgba(63,207,142,.15); color: #3fcf8e; }
  .tfa-ask h3 { margin: 0 0 6px; } .tfa-ask .rp-lbl, .tfa-ask .field { text-align: left; } .tfa-ask .rowb { justify-content: center; }
  .tfa-in { font: 800 26px ui-monospace, monospace !important; letter-spacing: .3em; text-align: center !important; max-width: 240px; margin: 12px auto !important; display: block; }
  .tfa-err { color: var(--red); font-weight: 800; font-size: 13px; margin: 0 0 8px; }
  .tfa-qr { width: 190px; height: 190px; margin: 10px auto; padding: 8px; background: #fff; border-radius: 14px; } .tfa-qr svg { width: 100%; height: 100%; display: block; }
  .tfa-key { display: inline-block; margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--bg); font: 800 14px ui-monospace, monospace; letter-spacing: .08em; color: var(--ink); user-select: all; }
  .tfa-open { display: inline-block; margin-top: 8px; color: var(--accent-2); font-weight: 800; }
  .tfa-codes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; } .tfa-codes code { padding: 8px; border-radius: 10px; background: var(--bg); font: 800 15px ui-monospace, monospace; letter-spacing: .06em; }
  .trash-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; }
  .trash-row .tr-t { flex: 1; min-width: 0; } .trash-row b { display: block; } .trash-row small { color: var(--muted); font-weight: 700; font-size: 12px; }
  .vtime { margin-left: 6px; font-variant-numeric: tabular-nums; font-weight: 800; opacity: .85; }
  .vtime:not(:empty)::before { content: '· '; opacity: .6; }
  .vtm { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 800; color: #3fcf8e; font-variant-numeric: tabular-nums; padding: 1px 6px; border-radius: 6px; background: rgba(63,207,142,.12); flex-shrink: 0; }
  .vtm:empty { display: none; } #side-list .vtm + .vlim { margin-left: 6px; }
  .srvtip { position: fixed; z-index: 60; padding: 9px 12px; border-radius: 12px; background: #0f0b09; color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.5); pointer-events: none; max-width: 260px; animation: popIn .12s var(--ease-out); }
  .srvtip::before { content: ''; position: absolute; left: -5px; top: 50%; margin-top: -5px; width: 10px; height: 10px; background: #0f0b09; transform: rotate(45deg); }
  .srvtip b { display: block; font-weight: 900; font-size: 14px; } .srvtip small { display: flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 700; font-size: 12px; margin-top: 2px; } .srvtip small .ic { width: 12px; height: 12px; }
  .srvtip .st-v { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: #3fcf8e; } .srvtip .st-v > .ic { width: 16px; height: 16px; }
  .srvtip .st-avs { display: flex; } .srvtip .st-avs .av { width: 26px; height: 26px; font-size: 11px; border: 2px solid #0f0b09; margin-left: -6px; } .srvtip .st-avs .av:first-child { margin-left: 0; }

// Sunucu sırası (sürükle-bırak) ve süreli susturma: her cihazda aynı olsun diye ayarlarla birlikte saklanır
const srvOrder = () => { try { return JSON.parse(store.get('kanka-srvorder') || '[]'); } catch { return []; } };
const muteUntil = () => { try { return JSON.parse(store.get('kanka-muteuntil') || '{}'); } catch { return {}; } };
function orderedServers() {
  const o = srvOrder(), pos = id => { const i = o.indexOf(id); return i < 0 ? 1e6 : i; };
  return S.servers.map((s, i) => [s, i]).sort((a, b) => pos(a[0].id) - pos(b[0].id) || a[1] - b[1]).map(x => x[0]);
}
function setSrvOrder(ids) { store.set('kanka-srvorder', JSON.stringify(ids)); syncPrefs(); renderRail(); }
function muteServerFor(sid, ms) {
  const mu = muteUntil();
  if (ms) { mutedServers.add(sid); if (ms === Infinity) delete mu[sid]; else mu[sid] = Date.now() + ms; }
  else { mutedServers.delete(sid); delete mu[sid]; }
  store.set('kanka-muteuntil', JSON.stringify(mu)); S.unreadServers.delete(sid); saveMuted(); renderRail(); if (S.view === 'server') renderSide();
}
setInterval(() => { const mu = muteUntil(), now = Date.now(); let ch = false; for (const [k, v] of Object.entries(mu)) if (v <= now) { delete mu[k]; mutedServers.delete(k); ch = true; } if (ch) { store.set('kanka-muteuntil', JSON.stringify(mu)); saveMuted(); renderRail(); } }, 30e3);
const railVoiceN = s => new Set(s.channels.filter(c => voiceLike(c.type)).flatMap(c => S.voice?.[c.id] || [])).size;
const railVoiceBadge = s => { const n = railVoiceN(s); return n ? `<span class="rvc">${ic('volume')}${n}</span>` : ''; };
function updRailVoice() { $('#rail')?.querySelectorAll('.srv[data-id]').forEach(b => { const s = S.servers.find(x => x.id === b.dataset.id); if (!s) return; b.querySelector('.rvc')?.remove(); b.insertAdjacentHTML('beforeend', railVoiceBadge(s)); }); }
function renderRail() {

  $('#disc-srv').onclick = () => showDiscover();
  $('#disc-srv').classList.toggle('hint', !S.servers.some(s => s.id !== 's1') && S.view !== 'discover');
  renderOnb();

  $('#join-srv').onclick = () => form('Sunucuya katıl', 'Arkadaşının gönderdiği davet linkini ya da kodunu yapıştır.', [{ k: 'code', p: 'Davet linki ya da kodu' }], v => joinInvite(v.code));
}
async function invitePreview(code) {
  try { const r = await fetch('/api/davet/' + encodeURIComponent(code)); const p = await r.json(); window.__invSrv = { ...p, id: '__inv' }; return p; } catch { return { error: 'Davet okunamadı' }; }
}
const inviteHTML = p => `<div class="invite-prev ${p.banner || p.bannerColor ? 'has-banner' : ''}">${p.banner || p.bannerColor ? `<div class="ib" style="background-image:${p.banner ? `url('${esc(p.banner)}')` : `linear-gradient(135deg, ${p.bannerColor}, ${p.bannerColor}99)`}"></div>` : ''}<div class="si">${p.iconImg ? `<img src="${esc(p.iconImg)}" alt="">` : esc(p.icon)}</div><div><small>Sunucuya davet edildin</small><b style="font-size:17px;display:flex;align-items:center;gap:6px">${badgeRow({ ...p, id: '__inv' }, 18)}${esc(p.name)}</b><small><span class="on"></span>${p.online} çevrimiçi · ${p.members} üye</small></div></div>`;
(async () => {
  const code = new URLSearchParams(location.search).get('davet'); if (!code) return;
  const p = await invitePreview(code);
  if (p.error) return;
  $('#auth-form .logo').insertAdjacentHTML('afterend', inviteHTML(p));
  $('#auth-form h1').textContent = 'Sana bir yer ayrıldı';
  $('#auth-form > p').textContent = 'Hesap aç ya da giriş yap, sunucuya kendiliğinden katılırsın.';
})();
async function joinInvite(code) {
  const p = await invitePreview(code);
  if (p.error) return toast(p.error);
  const have = S.servers.find(x => x.invite === code);
  if (have) return selectServer(have.id);
  modal(`${inviteHTML(p)}<div class="rowb"><button id="mx">Vazgeç</button><button class="primary" id="inv-join">Sunucuya katıl</button></div>`);
  $('#mx').onclick = closeModal;
  $('#inv-join').onclick = () => { closeModal(); joinInviteNow(code); };
}
function joinInviteNow(code) {
  socket.emit('joinInvite', code, s => {
    if (s.error) return toast(s.error);
    if (!S.servers.find(x => x.id === s.id)) S.servers.push(s);
    selectServer(s.id);
    if (!(s.welcome?.enabled && !s.accepted)) toast(`${s.name} sunucusuna katıldın`);
  });
}

      const d = Math.min(Math.max(0, g.dx), 96), k = Math.min(1, d / 64), ico = g.row.querySelector('.swr');
      for (const el of g.row.querySelectorAll(':scope > .col, :scope > .av')) el.style.transform = `translateX(${d * .85}px)`;
      ico.style.opacity = k; ico.style.transform = `scale(${.5 + .5 * k})`;

  }, true);
  // Uygulama arka plana giderse ya da dokunma yarıda kesilirse çekmeceler yarıda kalmasın
  const reset = () => { clearTimeout(lp); if (g?.row) { g.row.classList.remove('pressing', 'swiping'); for (const el of g.row.querySelectorAll(':scope > .col, :scope > .av')) el.style.transform = ''; g.row.querySelector('.swr')?.remove(); } clearDrag(); g = null; };

})();

// --- Konuşma algılama ---
// Herkes, duyduğu sesin kendisinden ölçer: yeşil halka sesle aynı anda yanar (sunucu üzerinden gecikmeli sinyal yok).
let vaCtx = null, vaTimer = null;
const vaMeters = {};
function meter(key, nameOf, stream) {
  try {
    vaCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (vaCtx.state === 'suspended') vaCtx.resume().catch(() => {});
    dropMeter(key);
    const src = vaCtx.createMediaStreamSource(stream), an = vaCtx.createAnalyser();
    an.fftSize = 512; an.smoothingTimeConstant = 0; src.connect(an);
    vaMeters[key] = { src, an, buf: new Float32Array(512), nameOf, last: 0, on: false, floor: -60 };
    vaTimer ||= setInterval(vaTick, 30);
  } catch (e) { console.warn('Konuşma ölçer açılamadı', e); }
}

  try { m.src.disconnect(); } catch {}

  delete vaMeters[key];
  if (!Object.keys(vaMeters).length) { clearInterval(vaTimer); vaTimer = null; }
}
function vaTick() {
  const now = performance.now();

  for (const [key, m] of Object.entries(vaMeters)) {
    m.an.getFloatTimeDomainData(m.buf);
    let e = 0; for (const v of m.buf) e += v * v;
    const db = 10 * Math.log10(e / m.buf.length + 1e-12);
    // Gürültü tabanını yavaşça izle; konuşma tabanın 12 dB üstünde ve en az -50 dB olmalı
    m.floor = db < m.floor ? db : m.floor + 0.02;
    const loud = db > Math.max(-50, Math.min(m.floor, -55) + 12) && (key !== 'me' || micLive());
    if (loud) m.last = now;
    const on = loud || (m.on && now - m.last < 220);
    if (on !== m.on) { m.on = on; setSpeaking(m.nameOf(), key, on); }
  }
}

}

function layoutStage() {
  const st = $('#stage'); if (!vview() || !st) return;
  const tiles = [...st.querySelectorAll('.tile')], gap = 12, top = 64, pad = 16;
  const W = st.clientWidth - pad * 2, H = st.clientHeight - top - pad;
  if (!tiles.length || W <= 0 || H <= 0) return;
  const size = (el, w, h) => { el.style.width = Math.floor(w) + 'px'; el.style.height = Math.floor(h) + 'px'; };
  const focus = tiles.find(t => t.classList.contains('focus')), rest = tiles.filter(t => t !== focus);
  let usedH;
  if (focus) {
    const sh = rest.length ? Math.min(150, H * .2) : 0;
    const fh = H - (sh ? sh + gap : 0); size(focus, W, fh);
    rest.forEach(t => size(t, sh * 16 / 9, sh));
    usedH = H;
  } else {
    let best = { w: 0 };
    for (let cols = 1; cols <= tiles.length; cols++) {
      const rows = Math.ceil(tiles.length / cols);
      let w = (W - gap * (cols - 1)) / cols, h = w * 9 / 16;
      if (h * rows + gap * (rows - 1) > H) { h = (H - gap * (rows - 1)) / rows; w = h * 16 / 9; }
      const score = w * (cols >= rows ? 1.25 : 1); // yan yana dizilim tercih edilir
      if (score > (best.score || 0)) best = { w, h, rows, score };
    }
    tiles.forEach(t => size(t, best.w, best.h));
    usedH = best.h * best.rows + gap * (best.rows - 1);
  }
  st.style.paddingTop = (top + Math.max(0, (H - usedH) / 2)) + 'px';
}

function tip(key, sel, title, text, place = 'top', tries = 0) {
  if (tipSeen.has(key)) return;
  const el = typeof sel === 'string' ? $(sel) : sel;
  if (!el || !el.getClientRects().length) return;
  if ($('#modal').classList.contains('open') || $('.ktip')) { if (tries < 8) setTimeout(() => tip(key, sel, title, text, place, tries + 1), 1500); return; }
  tipSeen.add(key); store.set('kanka-tips', JSON.stringify([...tipSeen]));

  t.innerHTML = `<div class="kt-arrow"></div><b>${title}</b><p>${text}</p><div class="kt-f"><span>İpucu</span><button>Anladım</button></div>`;
  document.body.appendChild(t); el.classList.add('tipfocus');
  const pos = () => {
    const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight, W = innerWidth, H = innerHeight;
    let p = place; if (p === 'right' && r.right + tw + 16 > W) p = 'top'; if (p === 'top' && r.top - th - 14 < 0) p = 'bottom';
    let x, y;
    if (p === 'right') { x = r.right + 14; y = r.top + r.height / 2 - th / 2; }
    else { x = r.left + r.width / 2 - tw / 2; y = p === 'top' ? r.top - th - 14 : r.bottom + 14; }
    x = Math.max(10, Math.min(W - tw - 10, x)); y = Math.max(10, Math.min(H - th - 10, y));
    t.dataset.p = p; t.style.left = x + 'px'; t.style.top = y + 'px';
    const a = t.querySelector('.kt-arrow');
    if (p === 'right') { a.style.left = '-6px'; a.style.top = Math.max(14, Math.min(th - 14, r.top + r.height / 2 - y)) + 'px'; }
    else { a.style.top = p === 'top' ? th - 6 + 'px' : '-6px'; a.style.left = Math.max(16, Math.min(tw - 16, r.left + r.width / 2 - x)) + 'px'; }
  };
  pos(); addEventListener('resize', pos);
  const close = () => { removeEventListener('resize', pos); el.classList.remove('tipfocus'); t.classList.add('out'); setTimeout(() => t.remove(), 220); };

  setTimeout(() => t.isConnected && close(), 14000);
}

  if (s.roles?.[n] === 'mod' || rolePerms.has('manageChannels')) return true;
  if (key === 'send' && rolePerms.has('manageMessages')) return true;
  const val = k => { let v = k === 'manage' ? rolePerms.has('manageMessages') : k === 'mention' ? rolePerms.has('mentionEveryone') : true;

      <div class="rowb"><button id="rp-back">Geri</button><button class="primary danger-btn" id="rp-send">${ic('flag')}Şikayet et</button></div>`, 'rep');
    $('#rp-chg').onclick = $('#rp-back').onclick = step1;

  const step3 = dup => {

    modal(`<div class="rp-done"><div class="rp-ok">${ic('check')}</div><h3>${dup ? 'Bunu zaten şikayet etmiştin' : 'Teşekkürler, şikayetin ulaştı'}</h3>

      <div class="rp-acts">${blocked ? '' : `<button id="rp-block" class="danger">${ic('ban')}<span><b>Engelle</b><small>Sana mesaj atamaz, arkadaşlığınız biter</small></span></button>`}
      ${ignored ? '' : `<button id="rp-ign">${ic('eye')}<span><b>Yok say</b><small>Mesajları senin için gizlenir, haberi olmaz</small></span></button>`}</div>
      <div class="rowb"><button class="primary" id="mx">Tamam</button></div></div>`, 'rep');

    if ($('#rp-ign')) $('#rp-ign').onclick = () => { uIgnored.add(target); saveU(); if (S.channel) renderMessages(); toast(`${target} yok sayılıyor`); $('#rp-ign').remove(); };
  };
  step1();
}
// İki tıkla onaylanan buton (iç içe pencere açmadan)
function armBtn(b, label, run) {
  b.onclick = () => {
    if (b.classList.contains('arm')) { clearTimeout(b._t); b.classList.remove('arm'); return run(); }
    b._txt ??= b.innerHTML; b.classList.add('arm'); b.innerHTML = label;
    b._t = setTimeout(() => { b.classList.remove('arm'); b.innerHTML = b._txt; }, 3500);
  };
}
function reportsPanel(el, serverId, state = { status: 'open' }) {
  el.innerHTML = `<div class="rpp"><div class="seg" id="rpp-seg"><button data-s="open" class="${state.status === 'open' ? 'on' : ''}">Açık</button><button data-s="done" class="${state.status === 'done' ? 'on' : ''}">Çözülenler</button></div><div id="rpp-list"><p class="hint">Yükleniyor…</p></div></div>`;
  el.querySelectorAll('#rpp-seg [data-s]').forEach(b => b.onclick = () => reportsPanel(el, serverId, { status: b.dataset.s }));
  socket.emit('reports', { serverId, status: state.status }, res => {
    const L = el.querySelector('#rpp-list'); if (!L) return;
    if (res.error) return L.innerHTML = `<p class="hint">${esc(res.error)}</p>`;
    if (!res.reports.length) return L.innerHTML = `<div class="rpp-empty">${ic('shield')}<b>${state.status === 'open' ? 'Bekleyen şikayet yok' : 'Henüz çözülen şikayet yok'}</b><span>${state.status === 'open' ? 'Ortalık sakin. Yeni şikayet gelince burada ve bildirimlerde görünecek.' : ''}</span></div>`;
    L.innerHTML = res.reports.map(r => {
      const s = r.serverId && S.servers.find(x => x.id === r.serverId), P = p => s && r.target !== S.me && r.target !== s.owner && perm(s, p);
      const line = m => `<div class="rpc-line ${m.id === r.msg?.id ? 'hit' : ''}"><b style="color:${userColor(m.author)}">${esc(m.author)}</b><span>${m.text ? fmt(m.text.slice(0, 300)) : m.image ? `<img src="${esc(m.image)}" alt="" data-view>` : '—'}</span><time>${hm(m.time)}</time></div>`;
      const acts = r.status === 'open' ? [
        r.kind === 'msg' && r.msgAlive ? `<button data-x="delete">${ic('trash')}Mesajı sil</button>` : '',
        s && !r.targetGone && P('timeout') ? `<button data-x="to">${ic('hourglass')}1 saat sustur</button>` : '',
        s && !r.targetGone && P('kick') ? `<button data-x="kick" class="danger">${ic('logout')}At</button>` : '',
        s && !r.targetGone && P('ban') ? `<button data-x="ban" class="danger">${ic('ban')}Yasakla</button>` : '',
        S.siteAdmin && r.target !== S.me && !r.targetGone && !r.targetBanned ? `<button data-x="siteban" class="danger">${ic('lock')}Hesabı kapat</button>` : '',
        `<button data-x="dismiss" class="ok">${ic('check')}Sorun yok</button>`].join('')
        : `<div class="rpc-res">${ic('check')}<span><b>${esc(r.action || 'Çözüldü')}</b> · ${esc(r.handledBy || '')} · ${r.handledAt ? ago(r.handledAt) : ''}</span><button data-x="reopen" class="alink">Tekrar aç</button></div>`;
      return `<article class="rpc ${r.urgent ? 'urg' : ''}" data-id="${r.id}">
        <header><span class="rpc-tag">${ic('flag')}${esc(r.reasonText)}</span><span class="rpc-where">${esc(r.where || '')}</span><time>${ago(r.at)}</time></header>
        <div class="rpc-who"><button class="rpc-user" data-u="${esc(r.target)}">${av(r.target)}<span><b>${esc(r.target)}</b><small>${r.kind === 'msg' ? 'Mesajı şikayet edildi' : 'Kullanıcı şikayet edildi'}${r.priors ? ` · <em>${r.priors} şikayet daha</em>` : ''}${r.targetBanned ? ' · <em>hesabı kapalı</em>' : ''}${r.targetGone ? ' · hesap silinmiş' : ''}</small></span></button>
          <small class="rpc-by">${r.by ? `Şikayet eden: <b>${esc(r.by)}</b>` : 'Şikayet eden gizli'}</small></div>
        ${r.msg ? `<div class="rpc-ctx">${(r.context || []).filter(m => m.time <= r.msg.time).map(line).join('')}${line(r.msg)}${(r.context || []).filter(m => m.time > r.msg.time).map(line).join('')}${r.msgAlive === false ? '<small class="rpc-gone">Mesaj artık yok (silinmiş)</small>' : ''}</div>` : ''}
        ${r.note ? `<blockquote class="rpc-note">“${esc(r.note)}”</blockquote>` : ''}
        <div class="rpc-acts">${acts}</div></article>`;
    }).join('');
    L.querySelectorAll('.rpc').forEach(card => {
      const r = res.reports.find(x => x.id === card.dataset.id), s = r.serverId && S.servers.find(x => x.id === r.serverId);
      const act = (action, extra = {}) => socket.emit('reportAct', { id: r.id, action, ...extra }, x => { if (x.error) return toast(x.error); card.classList.add('out'); setTimeout(() => reportsPanel(el, serverId, state), 260); });
      card.querySelector('.rpc-user').onclick = e => miniProfile(r.target, e.currentTarget);
      card.querySelectorAll('[data-x]').forEach(b => {
        const x = b.dataset.x;
        if (x === 'dismiss' || x === 'reopen') b.onclick = () => act(x);
        if (x === 'delete') armBtn(b, 'Silinsin mi? Tekrar bas', () => act('delete'));
        if (x === 'to') b.onclick = () => socket.emit('timeout', { serverId: s.id, name: r.target, minutes: 60 }, y => y.error ? toast(y.error) : act('resolve', { label: '1 saat susturuldu' }));
        if (x === 'kick') armBtn(b, 'Atılsın mı?', () => socket.emit('kick', { serverId: s.id, name: r.target }, y => y.error ? toast(y.error) : act('resolve', { label: 'Sunucudan atıldı' })));
        if (x === 'ban') armBtn(b, 'Yasaklansın mı?', () => socket.emit('ban', { serverId: s.id, name: r.target, reason: r.reasonText }, y => y.error ? toast(y.error) : act('resolve', { label: 'Sunucudan yasaklandı' })));
        if (x === 'siteban') armBtn(b, 'Kanka hesabı kapatılsın mı?', () => act('siteban', { reason: r.reasonText }));
      });
    });
  });
}

      <div class="ov-foot"><button class="btns2" id="ov-prev">${ic('eye')} 6 saniye önizle</button><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>O</kbd> ile oyundayken aç/kapat</span></div>`;
    const set = p => window.kankaDesktop.overlayConfig(p).then(draw);
    $('#ov-on').onchange = e => set({ on: e.target.checked });
    $('#ov-game').onchange = e => set({ onlyGame: e.target.checked });
    $('#ov-sp').onchange = e => set({ onlySpeaking: e.target.checked });
    if ($('#ov-nt')) $('#ov-nt').onchange = e => set({ notifs: e.target.checked });
    el.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => set({ pos: b.dataset.pos, preview: true }));
    el.querySelectorAll('[data-size]').forEach(b => b.onclick = () => set({ size: +b.dataset.size, preview: true }));
    $('#ov-op').onchange = e => set({ opacity: +e.target.value, preview: true });
    $('#ov-prev').onclick = () => { pushOverlay(); set({ preview: true }); toast('Katman 6 saniye ekranın köşesinde görünecek'); };
  };
  window.kankaDesktop.overlayConfig().then(draw);
}

function modal(html, cls = '') { document.querySelector('.bcard')?.remove(); const was = $('#modal').classList.contains('open'), wasSet = was && $('#modal-box').classList.contains('settings'), wasKey = $('#modal-box').dataset.mkey; $('#modal-box').className = 'box ' + cls; $('#modal-box').innerHTML = html; void $('#modal').offsetWidth; $('#modal').classList.add('open'); if (!was) ovOpen('modal', () => { if (saveGuard()) return false; closeModalRaw(); }); msetEnhance(!wasSet || wasKey !== msetKey()); }
function closeModalRaw() { $('#modal').classList.remove('open'); window.onMyActivity = null; }
function closeModal() { const was = $('#modal').classList.contains('open'); closeModalRaw(); if (ovStack?.some(o => o.name === 'msetpage')) ovClosed('msetpage'); if (was) ovClosed('modal'); }
$('#modal').onclick = e => { if (e.target.id === 'modal' && !saveGuard()) closeModal(); };

  $('#mx').onclick = closeModal; $('#ok').onclick = () => { closeModal(); onOk(); };
}
// ---------- Bildirimler 2.0: türe göre renk ve simge, ilerleme çubuğu, üstüne gelince durur ----------
const T_ERR = /(hata|yanlış|geçersiz|olmalı|yetkin yok|bulunamadı|çok fazla|olamaz|başarısız|gönderilemedi|kaydedilemedi|yapamazsın|erişimin yok|izin ver|dolu\b|reddedildi|kullanılmış|giriş yap|bağlanamadı|alınamadı|yüklenemedi|desteklenmiyor|bekle\b|yavaş)/i;
const T_OK = /(kaydedildi|kopyalandı|gönderildi|eklendi|ayarlandı|silindi|kaldırıldı|güncellendi|oluşturuldu|açıldı|kapatıldı|engellendi|yenilendi|hazır|sabitlendi|katıldın|kabul edildi|ulaştı|başlatıldı|üretildi|sayılıyor|düzeltildi|tamam)/i;
function toast(html, onClick, raw, o = {}) {
  const box = $('#toasts'), txt = raw ? html.replace(/<[^>]+>/g, ' ') : html;
  const type = o.type || (/^\s*(🎉|🥳|🏆)|<b>[^<]*(🎉|🏆)/.test(html) ? 'party' : /🛡️|🚨/.test(html) ? 'mod' : T_ERR.test(txt) ? 'err' : T_OK.test(txt) ? 'ok' : 'info');
  const ICO = { ok: 'check', err: 'x', info: 'bell', party: 'sparkle', mod: 'flag', msg: 'chat' };
  const t = document.createElement('div'); t.className = 'toast t-' + type + (onClick ? ' clk' : ''); t.setAttribute('role', type === 'err' ? 'alert' : 'status');
  const ttl = o.ttl || (type === 'msg' || type === 'mod' ? 8000 : type === 'err' ? 6500 : 4500);
  t.innerHTML = `<div class="t-ic">${o.av ? av(o.av) : ic(ICO[type])}</div><div class="t-b">${raw ? html : esc(html)}</div><button class="t-x" aria-label="Kapat">${ic('x')}</button><i class="t-bar" style="animation-duration:${ttl}ms"></i>`;
  let left = ttl, at = Date.now(), tm;
  const kill = () => { clearTimeout(tm); t.classList.add('out'); setTimeout(() => t.remove(), 260); };
  const run = () => { at = Date.now(); tm = setTimeout(kill, left); };
  t.onmouseenter = () => { clearTimeout(tm); left -= Date.now() - at; t.classList.add('hold'); };
  t.onmouseleave = () => { t.classList.remove('hold'); run(); };
  t.onclick = e => { if (e.target.closest('.t-x')) return kill(); kill(); onClick && onClick(); };
  box.appendChild(t);
  while (box.children.length > 4) box.firstElementChild.remove();
  run();
}
// ---------- Kaydet çubuğu: kaydetmeden kapatırken uyar, Ctrl+S ile kaydet ----------
let guardAt = 0;
function saveGuard() {
  const bar = document.querySelector('#modal.open .st-save.dirty');
  if (!bar) return false;
  if (Date.now() - guardAt < 2500) { guardAt = 0; return false; } // ikinci basışta yine de kapat
  guardAt = Date.now();
  bar.classList.remove('shake'); void bar.offsetWidth; bar.classList.add('shake', 'warn');
  const sp = bar.querySelector('span'); if (sp) sp.innerHTML = `<b>Kaydetmeden çıkıyorsun!</b>Çıkmak için tekrar bas`;
  setTimeout(() => { bar.classList.remove('warn'); if (sp) sp.innerHTML = SAVE_TXT; }, 2600);
  return true;
}
const SAVE_TXT = '<b>Kaydedilmemiş değişiklikler</b>Kaydetmeyi unutma kanka';
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { const b = document.querySelector('#modal.open .st-save.dirty .primary'); if (b) { e.preventDefault(); b.click(); } }
});
function flashSaved(bar) {
  if (!bar) return; bar.classList.add('saved'); const sp = bar.querySelector('span'); if (sp) sp.innerHTML = `<b>Kaydedildi</b>Değişiklikler uygulandı`; const ii = bar.querySelector('.sv-ic'); if (ii) ii.innerHTML = ic('check');
  setTimeout(() => { bar.classList.remove('saved'); if (sp) sp.innerHTML = SAVE_TXT; if (ii) ii.innerHTML = ic('info'); }, 1400);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (saveGuard()) return; closeModal(); $('#viewer').style.display = 'none'; } });
