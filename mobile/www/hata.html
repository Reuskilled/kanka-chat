<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanka Chat · Bağlantı yok</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0c;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px calc(32px + env(safe-area-inset-bottom));box-sizing:border-box}
img{width:84px;height:84px;border-radius:22px;margin-bottom:26px}
h1{font-size:24px;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
p{color:#a1a1aa;font-size:15px;line-height:1.5;margin:0 0 26px;max-width:320px}
button{border:0;border-radius:14px;background:#d4ff00;color:#0b0b0c;font-weight:800;font-size:16px;padding:15px 30px;min-width:200px}
button:active{transform:scale(.97)}
small{display:block;margin-top:18px;color:#71717a;font-size:13px}
</style></head><body><div class="w">
<img src="logo.png" alt="Kanka">
<h1>Bağlanamadık</h1>
<p>İnternet bağlantını kontrol et. Bağlantı gelince Kanka kaldığın yerden açılır.</p>
<button id="b">Tekrar dene</button>
<small id="s"></small>
</div><script>
const go = () => { document.getElementById('s').textContent = 'Bağlanıyor…'; location.replace('https://kankahq.com/app'); };
document.getElementById('b').onclick = go;
window.addEventListener('online', go);
let n = 0; setInterval(() => { if (navigator.onLine && ++n % 3 === 0) fetch('https://kankahq.com/api/surum', { cache: 'no-store' }).then(r => r.ok && go()).catch(() => {}); }, 5000);
</script></body></html>
