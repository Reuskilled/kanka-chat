name: Masaüstü sürümü
on:
  push:
    branches: [main]
    paths: ['desktop/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Kur ve derle
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
      - name: Sürümü yayınla
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          cd desktop/dist/squirrel-windows
          gh release view "v$V" >/dev/null 2>&1 && gh release delete "v$V" -y --cleanup-tag
          gh release create "v$V" --title "Kanka Chat $V" --notes "Otomatik derlendi" KankaChat-Kurulum.exe *.nupkg RELEASES
