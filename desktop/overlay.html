<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #box { position: absolute; display: flex; flex-direction: column; gap: 5px; padding: 6px; transition: opacity .25s; }
  body.tl #box { top: 0; left: 0; align-items: flex-start; } body.tr #box { top: 0; right: 0; align-items: flex-end; }
  body.bl #box { bottom: 0; left: 0; align-items: flex-start; flex-direction: column-reverse; } body.br #box { bottom: 0; right: 0; align-items: flex-end; flex-direction: column-reverse; }
  .head { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: rgba(15,11,9,.72); color: #f3e9e1; font-size: 11.5px; font-weight: 700; max-width: 250px; }
  .head i { width: 16px; height: 16px; border-radius: 5px; background: #F2652F; display: grid; place-items: center; font-style: normal; font-size: 10px; flex-shrink: 0; }
  .head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  .u { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border-radius: 999px; background: rgba(15,11,9,.62); color: #f3e9e1; max-width: 250px;
    transition: background .15s, opacity .3s, transform .2s; animation: in .25s ease-out both; }
  body.tr .u, body.br .u { flex-direction: row-reverse; padding: 3px 3px 3px 12px; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  .av { position: relative; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; overflow: visible; }
  .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .av::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2.5px solid #23d18b; opacity: 0; transform: scale(.9); transition: opacity .12s, transform .12s; }
  .u.sp { background: rgba(15,11,9,.85); }
  .u.sp .av::after { opacity: 1; transform: none; box-shadow: 0 0 10px rgba(35,209,139,.7); }
  .u.sp b { color: #fff; }
  .n { display: flex; align-items: center; gap: 6px; min-width: 0; }
  b { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e9dcd2; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  svg { width: 14px; height: 14px; flex-shrink: 0; fill: none; stroke: #ff6b6e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .more { font-size: 11.5px; font-weight: 700; color: #cbb8aa; padding: 2px 10px; border-radius: 999px; background: rgba(15,11,9,.55); }
  body.only .u:not(.sp) { display: none; }
  body.only .head, body.only .more { display: none; }
  .nt { display: flex; gap: 10px; align-items: flex-start; width: 270px; padding: 10px 12px 10px 10px; border-radius: 14px; background: rgba(15,11,9,.9); color: #f3e9e1; border-left: 3px solid #ff8a4c;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); animation: nin .3s cubic-bezier(.2,.9,.3,1.2) both; }
  body.tr .nt, body.br .nt { border-left: none; border-right: 3px solid #ff8a4c; }
  @keyframes nin { from { opacity: 0; transform: translateX(-16px) scale(.96); } }
  body.tr .nt, body.br .nt { animation-name: ninr; } @keyframes ninr { from { opacity: 0; transform: translateX(16px) scale(.96); } }
  .nt .av { width: 34px; height: 34px; }
  .nt .nb { min-width: 0; flex: 1; } .nt .nb b { display: block; font-size: 13px; color: #fff; }
  .nt .nb p { font-size: 12.5px; line-height: 1.35; color: #e2d4ca; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .nt .nb small { display: block; font-size: 11px; color: #a8978d; margin-top: 3px; font-weight: 600; }
  .gap { height: 6px; }
  .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body class="tl">
<div id="box"></div>
<script>
const MIC_OFF = '<svg viewBox="0 0 24 24"><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.8-1"/><path d="M5 11a7 7 0 0 0 11.7 5.2M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let last = '';
window.render = (st, cfg, notes) => {
  cfg = cfg || {}; notes = notes || [];
  document.body.className = (cfg.pos || 'tl') + (cfg.onlySpeaking ? ' only' : '');
  document.getElementById('box').style.opacity = cfg.opacity ?? 1;
  document.body.style.zoom = cfg.scale || 1;
  if (!st && !notes.length) { document.getElementById('box').innerHTML = ''; last = ''; return; }
  const key = JSON.stringify([st, cfg.pos, cfg.onlySpeaking, notes.map(n => n.at + n.t)]); if (key === last) return; last = key;
  const users = st?.users || [], max = 10;
  const row = u => `<div class="u ${u.sp ? 'sp' : ''}"><div class="av" style="background:${esc(u.c || '#5b4a40')}">${u.av ? `<img src="${esc(u.av)}" alt="" onerror="this.remove()">` : esc((u.n || '?')[0].toUpperCase())}</div><div class="n"><b>${esc(u.n)}</b>${u.m ? MIC_OFF : ''}</div></div>`;
  const note = n => `<div class="nt"><div class="av" style="background:${esc(n.c || '#5b4a40')}">${n.av ? `<img src="${esc(n.av)}" alt="" onerror="this.remove()">` : esc(n.i || '?')}</div><div class="nb"><b>${esc(n.t)}</b>${n.x ? `<p>${esc(n.x)}</p>` : ''}${n.w ? `<small>${esc(n.w)}</small>` : ''}</div></div>`;
  const voice = st ? `<div class="head"><i>K</i><span>${esc(st.room || 'Sesli oda')}${st.server ? ' · ' + esc(st.server) : ''}</span></div>` +
    users.slice(0, max).map(row).join('') + (users.length > max ? `<div class="more">+${users.length - max} kişi daha</div>` : '') : '';
  document.getElementById('box').innerHTML = voice + (voice && notes.length ? '<div class="gap"></div>' : '') + notes.map(note).join('');
};
</script>
</body>
</html>
