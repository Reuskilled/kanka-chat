i.I{font-style:normal;position:relative}i.I::after{content:'';position:absolute;left:37.5%;top:-25%;width:25%;height:20%;background:currentColor}

</style></head><body>
<div id="game">
 <div class="L" id="title"><div id="stars"></div><div class="tw" id="t1">KENDİ</div><div class="tw" id="t2">DISCORD'UMUZU</div><div class="tw" id="t3">YAPTIK!</div>
   <img id="tlogo"><div id="press">PRESS START</div><div id="copy">© 2026 KANKA CHAT</div></div>
 <div class="L" id="plat"><div class="cloud" style="left:30px;top:70px;width:28px"></div><div class="cloud" style="left:190px;top:100px;width:36px"></div>
   <div id="world"><div id="ground"></div></div><div id="flab"></div><div id="plus"></div></div>
 <div class="L" id="dun"><div id="wall"></div><div id="floor"></div><div id="rays"></div>
   <div id="chest"><div class="b"></div><div class="lid"></div><div class="lock"></div></div><div id="bdg" class="e">🧪</div>
   <div id="iget"><div class="a">ITEM GET!</div><div class="b">BETA TESTER ROZETİ</div><div class="c">İLK 300 KİŞİYE ÖZEL</div></div><div id="bang">!</div></div>
 <div class="L" id="boss"><div id="bh"><span>BETA ROZETİ</span><span id="hp">300/300</span></div><div id="bar"><div id="barf"></div></div>

 <canvas class="hero" id="hero" width="10" height="12"></canvas>
 <div id="hud"><div>KANKA<br><span id="sc">000000</span></div><div><span class="e" style="font-size:8px">🪙</span>×<span id="co">00</span></div><div>DÜNYA<br><span id="wd">1-1</span></div></div>
 <div id="box"><div id="who">KANKA</div><div id="txt"></div><div id="tri">▼</div></div>
 <canvas id="iris" width="270" height="480"></canvas>
</div>
<div id="scan"></div><div id="flash"></div>
<script>
const TOT=22.5;
const W2=1.14,W3=2.3,S2=3.24,S3=8.0,BR=9.4,BT=11.0,S4=12.5,DROP=15.15,WARN=16.38,S5=18.33,CTA=19.58;
const FT=[3.24,4.31,4.98,6.0,7.14];
const ITEMS=[['🎙️','SESLİ ODALAR'],['📹','KAMERA'],['🖥️','EKRAN PAYLAŞIMI'],['🔊','SESLİ MESAJ'],['🃏','OYUNLAR']];
const MARKS=[{t:0,k:'t1'},{t:W2,k:'t2'},{t:W3,k:'t3'},{t:2.95,k:'start'}];
FT.forEach((t,i)=>{MARKS.push({t:t-.05,k:'jump',i},{t:t+.12,k:'coin',i})});
MARKS.push({t:S3,k:'dun'},{t:BR,k:'open'},{t:BT,k:'get'},{t:S4,k:'boss'},{t:DROP,k:'drop'},{t:WARN,k:'warn'},{t:S5,k:'cont'},{t:CTA,k:'ins'});
for(let i=0;i<11;i++)MARKS.push({t:CTA+i*.08,k:'type'});
// diyalog: seslendirmeyle kelime kelime
const CAP=[
 [['SESLİ',3.24],['ODALAR,',3.7]],[['KAMERA,',4.31]],[['EKRAN',4.98],['PAYLAŞIMI,',5.35]],[['SESLİ',6.0],['MESAJ,',6.4]],[['OYUNLAR.',7.14]],
 [['AMA',8.0],['ASIL',8.3],['OLAY',8.6],['ŞU:',8.9]],[['İLK',9.4],['<b>300</b>',9.65],['KİŞİYE',10.1],['ÖZEL',10.55]],[['<b>BETA',11.0],['TESTER</b>',11.3],['ROZETİ.',11.75]],
 [['<b>250</b>',12.52],['KİŞİ',13.05],['KAPTI',13.35],['BİLE.',13.65]],[['SADECE...',14.21]],[['<b>50</b>',15.15],['YER',15.5],['KALDI!',15.8]],
 [['DOLUNCA',16.38],['BİR',16.95],['DAHA',17.2],['VERİLMEYECEK.',17.45]],[['KAÇINCI',18.33],['OLACAKSIN?',18.75]],[['<b>KANKAHQ.COM</b>',CTA]]];
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const q=v=>Math.round(v); // piksele yapıştır
// karakter (10x12, 2 kat)
const PAL={L:'#b8f400',S:'#fcb898',H:'#503000',E:'#000',B:'#3cbcfc',P:'#5050a0',K:'#503000'};
const FR={
 a:['...LLLL...','..LLLLLLL.','..HSSES...','..SSSSSS..','...SSSS...','..BBBBBB..','.SBBBBBBS.','.SBBBBBBS.','..BBBBBB..','..PPPPPP..','..PP..PP..','.KK....KK.'],
 b:['...LLLL...','..LLLLLLL.','..HSSES...','..SSSSSS..','...SSSS...','..BBBBBB..','..BBBBBBS.','.SBBBBBB..','..BBBBBB..','..PPPPPP..','...PPPP...','...KKKK...'],
 j:['S..LLLL..S','S.LLLLLLLS','S.HSSES..S','.SSSSSSSS.','...SSSS...','..BBBBBB..','..BBBBBB..','..BBBBBB..','..BBBBBB..','..PPPPPP..','..PP..PP..','.KK....KK.'],
 u:['S..LLLL..S','S.LLLLLLLS','S.HSSES..S','SSSSSSSSSS','...SSSS...','..BBBBBB..','..BBBBBB..','..BBBBBB..','..BBBBBB..','..PPPPPP..','..PP..PP..','.KK....KK.']};
const hc=$('hero').getContext('2d');
function drawHero(f,flip){hc.clearRect(0,0,10,12);FR[f].forEach((r,y)=>[...r].forEach((c,x)=>{if(c!=='.'){hc.fillStyle=PAL[c];hc.fillRect(flip?9-x:x,y,1,1)}}))}
// logo: 48 piksele indir
const lg=new Image();lg.src='k/logo.png';lg.onload=()=>{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(lg,0,0,24,24);const u=c.toDataURL();$('tlogo').src=u;$('clogo').src=u};
// yıldızlar
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const ST=[...Array(60)].map(()=>[rnd()*270,rnd()*480,rnd()<.3?2:1]);$('stars').innerHTML=ST.map(()=>'<i></i>').join('');const SI=[...$('stars').children];
// bloklar ve borular
const BX=i=>70+130*i;
const W=$('world');ITEMS.forEach((it,i)=>{W.insertAdjacentHTML('beforeend',`<div class="blk" id="bk${i}" style="left:${BX(i)}px">?</div><div class="item e" id="it${i}" style="left:${BX(i)}px">${it[0]}</div>`)});
[[140],[400],[660],[920]].forEach(([x])=>W.insertAdjacentHTML('beforeend',`<div class="pipe" style="left:${x}px"></div>`));
// 300 kare
$('grid').innerHTML='<i></i>'.repeat(300);const GI=[...$('grid').children];
// ışınlar
for(let i=0;i<12;i++)$('rays').insertAdjacentHTML('beforeend','<i></i>');const RI=[...$('rays').children];
const ic=$('iris').getContext('2d');
function iris(r){ic.clearRect(0,0,270,480);if(r>=330)return;ic.fillStyle='#000';ic.fillRect(0,0,270,480);ic.globalCompositeOperation='destination-out';
  // pikselli daire
  const s=4;for(let y=0;y<480;y+=s)for(let x=0;x<270;x+=s){const dx=x+2-135,dy=y+2-260;if(dx*dx+dy*dy<r*r)ic.fillRect(x,y,s,s)}ic.globalCompositeOperation='source-over'}
const TI=x=>String(x).replace(/İ/g,'<i class=I>I</i>');
function fixI(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())if(w.currentNode.nodeValue.includes('İ'))ns.push(w.currentNode);
  ns.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=TI(n.nodeValue);n.replaceWith(sp)})}
fixI(document.body);
const pad=(n,l)=>String(n).padStart(l,'0');
let lastCap=-1;
function setT(t){
  let fl=0;const flash=(t0,a,d=.1)=>{const x=t-t0;if(x>=0&&x<d)fl=Math.max(fl,a)};
  const show=(id,on)=>{$(id).style.display=on?'block':'none'};
  const hero=$('hero');let hx=-99,hy=0,hf='a',flip=false;
  let shx=0;const shake=(t0,a,d=.2)=>{if(t>=t0&&t<t0+d)shx+=(Math.floor((t-t0)*30)%2?a:-a)};
  // 1) başlık
  show('title',t<S2);
  if(t<S2){
    SI.forEach((s,i)=>{const st=ST[i];s.style.left=q(st[0])+'px';s.style.top=q((st[1]+t*(st[2]===2?120:50))%480)+'px';s.style.width=s.style.height=st[2]+'px'});
    [['t1',0,110],['t2',W2,150],['t3',W3,180]].forEach(([id,t0,y])=>{const e=$(id);e.style.display=t>=t0?'block':'none';const p=cl((t-t0)/.15);
      const b=p<1?-80*(1-p):(t-t0<.3?-6*Math.sin((t-t0-.15)/.15*Math.PI):0);e.style.top=q(y+b)+'px'});
    $('tlogo').style.display=t>=W3+.1?'block':'none';$('tlogo').style.top=q(250-(t<W3+.4?Math.sin((t-W3-.1)/.3*Math.PI)*12:0))+'px';
    $('press').style.display=t>=W3+.2&&(t<2.95?Math.floor(t*3)%2===0:Math.floor(t*16)%2===0)?'block':'none';
    shake(0,2);shake(W2,2);shake(W3,4,.3);
  }
  flash(0,.6,.07);flash(W3,1,.1);
  // 2) platform
  show('plat',t>=S2&&t<S3);
  let coins=0,score=0;
  FT.forEach((ft,i)=>{if(t>=ft+.12){coins++;score+=100}});if(t>=BT)score+=1000;if(t>=DROP)score+=500;
  if(t>=S2&&t<S3){
    // dünya kayması: blok i, karakterin tam üstüne FT[i]'de gelir
    let off=0;for(let i=0;i<5;i++){if(t>=FT[i]+.35){const nx=i<4?FT[i+1]-.05:S3;off=130*i+130*cl((t-FT[i]-.35)/(nx-FT[i]-.35))}else if(t>=FT[i]-.05)off=130*i}
    W.style.transform=`translateX(${-q(off)}px)`;
    hx=65;hy=336;let moving=false;
    let jumping=false;FT.forEach((ft,i)=>{const d=t-(ft-.05);if(d>=0&&d<.4){jumping=true;const p=d/.4;hy=336-q(60*Math.sin(p*Math.PI))}});
    for(let i=0;i<5;i++){const nx=i<4?FT[i+1]-.05:S3;if(t>=FT[i]+.35&&t<nx)moving=true}
    hf=jumping?'j':moving?(Math.floor(t*10)%2?'a':'b'):'a';
    ITEMS.forEach((it,i)=>{const bk=$('bk'+i),im=$('it'+i),d=t-(FT[i]+.12);bk.className='blk'+(d>=0?' used':'');
      bk.style.top=(260-(d>=0&&d<.1?4:0))+'px';im.style.display=d>=0?'block':'none';im.style.top=q(240-Math.min(30,d*200)+Math.sin(t*6+i)*2)+'px'});
    let cur=-1;FT.forEach((ft,i)=>{if(t>=ft+.12)cur=i});
    const fl2=$('flab');fl2.innerHTML=cur>=0?TI(ITEMS[cur][1]+'!'):'';fl2.style.top=q(120-(cur>=0&&t-FT[cur]-.12<.1?6:0))+'px';
    const pl=$('plus');const pd=cur>=0?t-FT[cur]-.12:9;pl.style.display=pd<.6?'block':'none';pl.textContent='+100';pl.style.left='72px';pl.style.top=q(250-pd*60)+'px';
  }
  // 3) zindan
  show('dun',t>=S3&&t<S4);
  if(t>=S3&&t<S4){
    hx=70;hy=336;hf=t>=BT?'u':'a';
    const ch=$('chest');ch.style.left=q(119+(t<BR&&t>S3+.6?(Math.floor(t*20)%2?2:-2):0))+'px';
    const op=cl((t-BR)/.15);ch.querySelector('.lid').style.transform=`rotate(${-q(op*100)}deg)`;ch.querySelector('.lock').style.display=t<BR?'block':'none';
    RI.forEach((r,i)=>{r.style.display=t>=BR?'block':'none';r.style.transform=`rotate(${i*30+t*40}deg)`;r.style.opacity=.5});
    // rozet: sandıktan yükselir, BT'de karakterin başının üstüne gider
    const bd=$('bdg');bd.style.display=t>=BR?'grid':'none';
    if(t<BT){bd.style.left='119px';bd.style.top=q(320-eo((t-BR)/.6)*60)+'px'}
    else{const p=eo((t-BT)/.25);bd.style.left=q(119+(64-119)*p)+'px';bd.style.top=q(260+(296-260)*p)+'px'}
    const ig=$('iget');ig.style.display=t>=BT?'block':'none';ig.querySelector('.a').style.visibility=Math.floor((t-BT)*6)%2&&t<BT+1?'hidden':'visible';
