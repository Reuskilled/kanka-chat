<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<!-- "Kendi Discord'umuzu yaptık" → özellikler → Beta Tester rozeti → 50 yer kaldı. 15 sn, 120 BPM. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0d;font-family:'Inter Display','Inter',sans-serif;color:#f6f6f2}
.S{position:absolute;inset:0}
#bg{background:radial-gradient(1000px 1000px at 50% 45%,var(--tc,#D4FF00)22,transparent 65%)}
#grain{background-image:radial-gradient(#ffffff07 1px,transparent 1px);background-size:6px 6px}
.big{font-weight:900;letter-spacing:-4px;line-height:.9;text-align:center;text-transform:uppercase}
.lime{color:#D4FF00}
/* S1 */
#s1{position:absolute;left:0;right:0;top:170px;display:flex;flex-direction:column;align-items:center}
#s1 .w{will-change:transform}
#w1{font-size:150px}#w2{font-size:112px;letter-spacing:-5px;color:#D4FF00;margin-top:10px}#w3{font-size:170px;margin-top:10px}
#phones{position:absolute;left:0;right:0;top:820px;height:1000px}
.ph{position:absolute;width:390px;height:844px;border-radius:52px;overflow:hidden;border:10px solid #26262c;background:#000;box-shadow:0 40px 120px #000d}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* S2 */
#s2{position:absolute;inset:0}
#cap{position:absolute;left:0;right:0;top:190px;text-align:center}
#cap .k{font-size:44px;font-weight:900;letter-spacing:8px;color:#8a8a84}
#cap .t{font-size:124px;margin-top:14px}
#ph2{left:50%;top:520px;margin-left:-260px;width:520px;height:1125px;border-radius:64px;border-width:12px}
#num{position:absolute;right:90px;top:560px;width:120px;height:120px;border-radius:50%;background:#D4FF00;color:#111;font-size:64px;font-weight:900;display:grid;place-items:center}
/* S3 */
#s3{position:absolute;inset:0}
#s3 .q{position:absolute;left:0;right:0;top:190px;font-size:118px}
#disc{position:absolute;left:50%;top:560px;width:500px;height:500px;margin-left:-250px}
#disc .glow{position:absolute;inset:-140px;border-radius:50%;background:radial-gradient(circle,#b07cff 0%,transparent 62%);opacity:.45}
#disc .ring{position:absolute;inset:0;border-radius:50%;padding:22px;background:conic-gradient(from var(--a,0deg),#b07cff,#fff,#5ab8ff,#b07cff,#00000088,#b07cff)}
#disc .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2a33,#101014 70%);display:grid;place-items:center;box-shadow:inset 0 0 60px #000c}
#disc .e{font-size:270px;line-height:1;font-family:'Noto Color Emoji'}
#bname{position:absolute;left:0;right:0;top:1130px;text-align:center;font-size:104px;font-weight:900;letter-spacing:-2px}
#bsub{position:absolute;left:0;right:0;top:1260px;text-align:center;font-size:50px;font-weight:800;color:#c9b8ff}
#tag{position:absolute;left:50%;top:1360px;transform:translateX(-50%);font-size:40px;font-weight:900;letter-spacing:8px;padding:12px 30px;border-radius:40px;border:4px solid #b07cff;color:#b07cff;white-space:nowrap}
/* S4 */
#s4{position:absolute;inset:0}
#s4 .top{position:absolute;left:0;right:0;top:220px;text-align:center;font-size:52px;font-weight:900;letter-spacing:6px;color:#8a8a84}
#n50{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:520px;font-weight:900;letter-spacing:-20px;line-height:1;color:#D4FF00}
#yer{position:absolute;left:0;right:0;top:860px;font-size:150px}
#bar{position:absolute;left:110px;right:110px;top:1140px;height:84px;border-radius:42px;background:#1b1b20;border:4px solid #2c2c33;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5ab8ff,#b07cff 60%,#ff5a7a)}
#barl{position:absolute;left:110px;right:110px;top:1250px;display:flex;justify-content:space-between;font-size:46px;font-weight:900}
#barl span:last-child{color:#8a8a84}
#warn{position:absolute;left:0;right:0;top:1400px;text-align:center;font-size:58px;font-weight:800;color:#d8d8d0;line-height:1.25}
#warn b{color:#ff5a7a}
/* S5 */
#s5{position:absolute;inset:0}
#s5 .a{position:absolute;left:0;right:0;top:380px;font-size:130px}
#s5 .b{position:absolute;left:0;right:0;top:720px;text-align:center;font-size:130px;font-family:'Noto Color Emoji';font-weight:900}
#cta{position:absolute;left:50%;top:1080px;width:780px;margin-left:-390px;height:150px;border-radius:80px;background:#D4FF00;color:#111;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900;box-shadow:0 30px 90px #D4FF0055}
#s5 .c{position:absolute;left:0;right:0;top:1290px;text-align:center;font-size:50px;font-weight:800;color:#9a9a92}
#logo{position:absolute;left:50%;top:1500px;width:150px;margin-left:-75px;border-radius:34px}
#flash{background:#fff;opacity:0}
</style></head><body>
<div class="S" id="bg"></div><div class="S" id="grain"></div>
<div id="s1"><div class="w big" id="w1">KENDİ</div><div class="w big" id="w2">DISCORD'UMUZU</div><div class="w big" id="w3">YAPTIK</div></div>
<div id="phones">
  <div class="ph" id="p1"><img src="e2/vm-kanal.jpg"></div>
  <div class="ph" id="p3"><img src="e2/ar-pisti-1.jpg"></div>
  <div class="ph" id="p2"><img src="e2/ses-1-oda.jpg"></div>
</div>
<div id="s2"><div id="cap"><div class="k">KANKA CHAT</div><div class="t big"></div></div><div class="ph" id="ph2"><img src="e2/ses-1-oda.jpg"><img src="e2/vid-1-kamera.jpg"><img src="e2/vm-kanal.jpg"><img src="e2/ar-pisti-1.jpg"></div><div id="num"></div></div>
<div id="s3"><div class="q big">ERKEN GELENE<br><span class="lime">ROZET</span></div>
  <div id="disc"><div class="glow"></div><div class="ring"><div class="in"><div class="e">🧪</div></div></div></div>
  <div id="bname">Beta Tester</div><div id="bsub">ilk 300 kişiye özel</div><div id="tag">EFSANEVİ · SINIRLI</div></div>
<div id="s4"><div class="top">BETA ROZETİ İÇİN</div><div id="n50">50</div><div class="big" id="yer">YER KALDI</div>
  <div id="bar"><div id="fill"></div></div><div id="barl"><span id="cnt">250 / 300</span><span>doldu</span></div>
  <div id="warn">300 dolunca<br><b>bir daha verilmeyecek</b></div></div>
<div id="s5"><div class="a big">KAÇINCI<br><span class="lime">OLACAKSIN?</span></div><div class="b">👀</div>
  <div id="cta">kankahq.com</div><div class="c">ücretsiz · telefon, web, masaüstü</div><img id="logo" src="k/logo.png"></div>
<div class="S" id="flash"></div>
<script>
const TOT=22.5;
// sahne zamanları seslendirmeye göre (Furkan, ElevenLabs)
const W1=0,W2=1.14,W3=2.3,S2=3.24,S3=8.0,BR=9.4,S4=12.5,DROP=15.15,WARN=16.38,S5=18.33,CTA=19.58;
const F=[['SESLİ ODALAR','e2/ses-1-oda.jpg'],['KAMERA + EKRAN','e2/vid-1-kamera.jpg'],['SESLİ MESAJ','e2/vm-kanal.jpg'],['OYUNLAR','e2/ar-pisti-1.jpg']];
const FT=[3.24,4.31,6.0,7.14],FE=8.0;
const MARKS=[{t:W1,k:'slam'},{t:W2,k:'slam'},{t:W3,k:'slam2'},{t:W3+.4,k:'whoosh'}];
F.forEach((f,i)=>MARKS.push({t:FT[i],k:'swipe',i}));
MARKS.push({t:S3,k:'rise'},{t:BR,k:'badge'},{t:S4,k:'tick'},{t:DROP,k:'drop'},{t:S5,k:'cta'});
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const show=(id,o,tf)=>{const e=$(id);e.style.opacity=o;e.style.display=o>0?'block':'none';if(tf!==undefined)e.style.transform=tf};
function slam(el,t0,t){const p=cl((t-t0)/.16);el.style.opacity=t>=t0?1:0;el.style.transform=`scale(${t>=t0?2.2-1.2*eo(p):1})`}
function setT(t){
  let fl=0;const flash=(t0,a=.5,d=.14)=>{const x=t-t0;if(x>=0&&x<d)fl=Math.max(fl,a*(1-x/d))};
  document.body.style.setProperty('--tc',t<S3?'#D4FF00':t<S4?'#b07cff':t<S5?'#ff5a7a':'#D4FF00');
  // S1: 0-3
  const o1=t<S2-.2?1:1-eo((t-(S2-.2))/.2);
  show('s1',o1);show('phones',o1);
  if(o1>0){
    slam($('w1'),W1,t);slam($('w2'),W2,t);slam($('w3'),W3,t);
    const sh=t>=W3&&t<W3+.25?Math.sin(t*90)*14*(1-(t-W3)/.25):0,up=eo((t-(W2+.3))/.5);$('s1').style.transform=`translate(${sh}px,${(1-up)*560}px)`;
    const P0=W2+.3,pp=eo((t-P0)/.6);$('phones').style.opacity=t<P0?0:o1;const _=0,fl2=Math.sin(t*2.2)*8;
    $('p2').style.cssText+=`;left:345px;top:${60+(1-pp)*900+fl2}px;transform:scale(1.05)`;
    $('p1').style.cssText+=`;left:70px;top:${150+(1-eo((t-P0-.1)/.6))*900-fl2}px;transform:rotate(-9deg) scale(.92)`;
    $('p3').style.cssText+=`;left:620px;top:${150+(1-eo((t-P0-.2)/.6))*900+fl2}px;transform:rotate(9deg) scale(.92)`;
  }
  flash(W1,.6);flash(W3,.4);
  // S2: 3-6 özellikler
  const in2=t>=S2-.1&&t<FE+.1;show('s2',in2?cl((t-(S2-.1))/.1)*(t>FE-.05?1-cl((t-(FE-.05))/.15):1):0);
  if(in2){let i=0;for(let k=0;k<4;k++)if(t>=FT[k])i=k;const lt=t-FT[i],p=back(lt/.22);
    $('cap').querySelector('.t').textContent=F[i][0];[...$('ph2').children].forEach((im,k)=>im.style.display=k===i?'block':'none');$('num').textContent=i+1;
    $('ph2').style.transform=`translateX(${(1-p)*700*(i%2?-1:1)}px) rotate(${(1-p)*(i%2?-12:12)}deg)`;
    $('cap').style.transform=`scale(${.85+.15*eo(lt/.15)})`;$('num').style.transform=`scale(${back(lt/.2)})`;}
  // S3: 6-9 rozet
  const in3=t>=S3&&t<S4+.05;show('s3',in3?(t>S4-.1?1-cl((t-(S4-.1))/.15):1):0);
  if(in3){const q=$('s3').querySelector('.q');q.style.transform=`scale(${.8+.2*back((t-S3)/.25)})`;
    const d=$('disc'),pb=back((t-BR)/.35);d.style.opacity=t>=BR?1:0;d.style.transform=`scale(${t>=BR?pb:0}) rotate(${(1-cl((t-BR)/.35))*-40}deg)`;
    d.querySelector('.ring').style.setProperty('--a',(t*200)+'deg');
    ['bname','bsub','tag'].forEach((id,k)=>{const x=$(id),L0=BR+.4+k*.15,p=eo((t-L0)/.2);x.style.opacity=t>=L0?p:0;x.style.marginTop=(1-p)*40+'px'});
    const em=d.querySelector('.e');em.textContent=t<BR?'🔒':'🧪';em.style.filter=t<BR?'grayscale(1)':'none';
    if(t<BR){const k=(t-S3)/(BR-S3);d.style.opacity=.25+.25*k;d.style.transform=`scale(${.75+.08*Math.abs(Math.sin(k*Math.PI*4))*k})`}}
  flash(BR,.6,.18);
  // S4: 9-12.5 sayaç
  const in4=t>=S4&&t<S5+.1;show('s4',in4?(t>S5-.1?1-cl((t-(S5-.1))/.2):1):0);
  if(in4){const fp=eo((t-S4)/1.5),filled=Math.round(250*fp);
    $('fill').style.width=(filled/300*100)+'%';$('cnt').textContent=`${filled} / 300`;
    const left=300-filled;$('n50').textContent=left;
    const lp=t>=DROP?back((t-DROP)/.25):1;$('n50').style.transform=`scale(${t>=DROP?(1.25-.25*lp)+.04*Math.abs(Math.sin((t-DROP)*Math.PI*2)):1})`;
    $('n50').style.color=t>=DROP?'#D4FF00':'#5a5a55';
    $('yer').style.opacity=t>=DROP?1:0;$('yer').style.transform=`scale(${t>=DROP?.8+.2*back((t-DROP)/.25):1})`;
    $('warn').style.opacity=t>=WARN?eo((t-WARN)/.25):0;
    const sh=t>=DROP&&t<DROP+.25?Math.sin(t*90)*16*(1-(t-DROP)/.25):0;$('s4').style.transform=`translateX(${sh}px)`;}
  flash(DROP,.55,.18);
  // S5: 12.5-15
  const in5=t>=S5;show('s5',in5?cl((t-S5)/.12):0);
  if(in5){$('s5').querySelector('.a').style.transform=`scale(${.8+.2*back((t-S5)/.25)})`;
    $('cta').style.transform=`scale(${t>=CTA?back((t-CTA)/.25)*(1+.04*Math.abs(Math.sin((t-CTA)*Math.PI*2))):0})`;
    $('s5').querySelector('.b').style.transform=`scale(${t>=S5+.2?back((t-S5+.2)/.2):0})`;
    $('s5').querySelector('.c').style.opacity=t>=CTA+.3?eo((t-CTA+.3)/.3):0;$('logo').style.opacity=t>=CTA+.5?eo((t-CTA+.5)/.3):0;}
  flash(S5,.4);
  $('flash').style.opacity=fl;
}
setT(0);
</script></body></html>
