.chip{display:inline-block;font-size:28px;font-weight:900;letter-spacing:3px;padding:8px 22px;border-radius:99px;color:#ffcf5c;border:3px solid #ffcf5c77;background:#ffcf5c1a;margin-top:8px}

.bar{position:absolute;left:120px;right:120px;top:1110px;height:46px;border-radius:46px;background:#ffffff12;overflow:hidden;border:2px solid #ffffff1a}
.bar i{display:block;height:100%;border-radius:46px;background:linear-gradient(90deg,#7cf0ff,#6a4bff);box-shadow:0 0 30px #7c9bffaa}
#cnt{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:150px;font-weight:900;letter-spacing:-6px}
#stamp{position:absolute;left:50%;top:1300px;font-size:110px;font-weight:900;color:#ff5a5a;border:12px solid #ff5a5a;border-radius:30px;padding:14px 44px;white-space:nowrap;background:#0f0b09cc}
.q{position:absolute;left:50%;top:560px;width:640px;height:820px;margin-left:-320px;border-radius:56px;border:5px dashed #ff8a4c;background:radial-gradient(circle at 50% 40%,#ff8a4c22,#0f0b09 70%);display:grid;place-items:center;align-content:center;gap:10px;box-shadow:0 0 120px #ff8a4c33}
.q b{font-size:220px;font-weight:900;letter-spacing:-8px}.q span{font-size:44px;color:#d9c4b2;font-weight:800}
#url{position:absolute;left:50%;top:1560px;font-size:76px;font-weight:900;padding:24px 60px;border-radius:999px;background:linear-gradient(120deg,#ff8a4c,#ff5a2e);color:#fff;white-space:nowrap;box-shadow:0 24px 70px #ff5a2e66}
#flash{position:absolute;inset:0;background:#fff;opacity:0}

<script>
const TOT=21;
const MARKS={pop:[.5,1.2,1.8,3.4,7.6,8.4,9.2,10,12.4,14.6,16.8,18.6],tick:[],type:[],whoosh:[2.9,6.9,11.9,16.2,20.2],fail:[14.4]};
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),bk=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},L=(a,b,x)=>a+(b-a)*x;
const vis=(id,on)=>$(id).style.display=on?'':'none';
const DECK=[['#001','K','#ff8a4c'],['#037','M','#3fcf8e'],['#058','E','#6a4bff'],['#083','S','#ff6b9a'],['#104','A','#4aa8ff']];
$('deck').innerHTML=DECK.map((d,i)=>`<div class="mini" id="m${i}"><svg viewBox="0 0 48 48"><use href="#kb-beta"/></svg><b class="cy">${d[0]}</b><span style="margin-left:auto;width:70px;height:70px;border-radius:50%;background:${d[2]};display:grid;place-items:center;font-size:36px;font-weight:900">${d[1]}</span></div>`).join('');
function setT(t){
  const ph=t/TOT*Math.PI*2;
  $('rays').style.transform=`rotate(${t/TOT*264}deg)`;
  // S0 kanca (0-3) + döngü dönüşü (20.2-21)
  const s0=t<3.1||t>=20.2; vis('s0',s0);
  if(s0){ if(t<3.1){ $('s0').style.opacity=1-seg(t,2.8,3.1);
      $('h0').style.opacity=1; $('c0').style.transform=`scale(${1+.03*Math.sin(t*6)*(t<2.6?1:0)}) translateY(${Math.sin(ph*7)*8}px)`; $('c0').style.opacity=1;
      $('h1').style.opacity=seg(t,.5,.58); $('h1').style.transform=`scale(${L(1.5,1,bk(seg(t,.5,.8)))})`;
      $('h2').style.opacity=seg(t,1.2,1.28); $('h2').style.transform=`scale(${L(1.6,1,bk(seg(t,1.2,1.5)))})`; }
    else { $('s0').style.opacity=1; $('h0').style.opacity=seg(t,20.25,20.45); $('h1').style.opacity=0; $('h2').style.opacity=0;
      const b=bk(seg(t,20.3,20.8)); $('c0').style.opacity=seg(t,20.3,20.4); $('c0').style.transform=`scale(${L(.4,1,b)}) translateY(${Math.sin(ph*7)*8}px)`; } }
  // S1 3-7
  const s1=t>=2.9&&t<7.1; vis('s1',s1);
  if(s1){ $('s1').style.opacity=seg(t,2.9,3.1)*(1-seg(t,6.8,7.1)); $('t1').style.opacity=seg(t,3.1,3.3);
    const e=bk(seg(t,3.2,3.7)); $('c1').style.transform=`scale(${L(.6,1,e)}) rotate(${L(-8,0,eo(seg(t,3.2,3.9)))}deg)`; }
  // S2 7-12: numaralar yığılıyor
  const s2=t>=6.9&&t<12.1; vis('s2',s2);
  if(s2){ $('s2').style.opacity=seg(t,6.9,7.1)*(1-seg(t,11.8,12.1)); $('t2').style.opacity=seg(t,7,7.2);
    DECK.forEach((d,i)=>{ const st=7.6+i*.8, e=bk(seg(t,st,st+.35)), m=$('m'+i); m.style.opacity=seg(t,st,st+.08); m.style.transform=`translateY(${560+i*230}px) translateX(${L(i%2?600:-600,0,eo(seg(t,st,st+.35)))}px) scale(${L(.8,1,e)})`; m.style.borderColor=i===DECK.length-1?'#ffcf5c':'#4a4a90'; }); }
  // S3 12-16
  const s3=t>=11.9&&t<16.4; vis('s3',s3);
  if(s3){ $('s3').style.opacity=seg(t,11.9,12.1)*(1-seg(t,16.1,16.4)); $('t3').style.opacity=seg(t,12.1,12.3);
    const n=Math.round(L(104,300,eo(seg(t,12.4,14.3)))); $('cn').textContent=n; $('bar').style.width=(n/3)+'%';
    $('stamp').style.opacity=seg(t,14.4,14.5); $('stamp').style.transform=`translateX(-50%) rotate(-8deg) scale(${L(2.2,1,eo(seg(t,14.4,14.65)))})`; }
  // S4 16-20.4
  const s4=t>=16.2&&t<20.45; vis('s4',s4);
  if(s4){ $('s4').style.opacity=seg(t,16.2,16.4)*(1-seg(t,20.0,20.3)); $('t4').style.opacity=seg(t,16.4,16.6); $('t4').style.transform=`scale(${L(1.4,1,bk(seg(t,16.4,16.7)))})`;
    const e=bk(seg(t,16.8,17.3)); $('q').style.transform=`scale(${L(.5,1,e)*(1+.025*Math.sin(t*5))})`; $('q').style.opacity=seg(t,16.8,16.9);
    $('qn').textContent=t<17.6?'#???':t<18.4?['#1','#2','#3','#4','#5','#6','#7','#8','#9'][Math.floor((t-17.6)*12)%9]+'??':'#???';
    const u=bk(seg(t,18.6,19)); $('url').style.opacity=seg(t,18.6,18.7); $('url').style.transform=`translateX(-50%) scale(${L(.5,1,u)})`; }
  $('flash').style.opacity=t>14.4&&t<14.65?.35*(1-seg(t,14.4,14.65)):0;
}
setT(0);
</script></body></html>
