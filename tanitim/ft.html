<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0b09;font-family:'Inter Display','Inter','Poppins',sans-serif;color:#f9efe4}
.L{position:absolute;inset:0}
#bg{background:radial-gradient(900px 900px at 50% 38%,#ff8a4c38,transparent 65%),radial-gradient(700px 700px at 85% 90%,#ff5a2e2a,transparent 60%)}
#grain{opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.hot{background:linear-gradient(120deg,#ffc08f,#ff8a4c 45%,#ff5a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-weight:900;letter-spacing:-4px;line-height:.95;text-transform:uppercase;text-align:center}
#intro .t{position:absolute;left:0;right:0;top:560px;font-size:130px}
#intro img{position:absolute;left:50%;top:1150px;width:300px;height:300px;margin-left:-150px;border-radius:80px;box-shadow:0 30px 120px #ff6a2e88}
/* feature scene */
#num{position:absolute;left:80px;top:190px;font-size:40px;font-weight:900;color:#1a0f08;background:linear-gradient(135deg,#ff8a4c,#ff5a2e);padding:10px 26px;border-radius:999px}
#cnt{position:absolute;right:80px;top:200px;font-size:34px;font-weight:800;color:#8a7464}
#title{position:absolute;left:80px;right:60px;top:290px;font-size:108px;font-weight:900;letter-spacing:-4px;line-height:.95;text-transform:uppercase}
#sub{position:absolute;left:80px;right:80px;top:560px;font-size:42px;font-weight:700;color:#d9c4b2;line-height:1.3}
#card{position:absolute;overflow:hidden;border-radius:34px;border:3px solid #4a3a30;box-shadow:0 60px 140px #000c;background:#17110e}
#card img{position:absolute;display:block}
#card.phone{border:14px solid #2a201b;border-radius:70px}
.dots{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;gap:14px}
.dots i{width:16px;height:16px;border-radius:8px;background:#3a2c24;transition:none}
.dots i.on{width:56px;background:#ff8a4c}
/* level graphic */
#lvl{position:absolute;left:90px;right:90px;top:760px;height:960px;display:none}
.lcard{position:absolute;left:0;right:0;background:#1f1713;border:3px solid #3a2c24;border-radius:44px;padding:40px 50px;display:flex;align-items:center;gap:36px}
.lcard .ic{width:140px;height:140px;border-radius:40px;display:grid;place-items:center;font-size:76px;flex:none}
.lcard h3{font-size:62px;font-weight:900;letter-spacing:-1.5px}
.lcard p{font-size:34px;color:#c9b4a3;font-weight:700;margin-top:6px}
#xpbar{height:26px;border-radius:13px;background:#2d221c;margin-top:18px;overflow:hidden;width:560px}
#xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a4c,#ff5a2e)}
.frames{display:flex;gap:22px;margin-top:16px}
.frames b{width:84px;height:84px;border-radius:50%;background:#2a201b;border:7px solid}
/* outro */
#outro .t{position:absolute;left:0;right:0;top:500px;font-size:120px}
#outro img{position:absolute;left:50%;top:960px;width:240px;height:240px;margin-left:-120px;border-radius:64px;box-shadow:0 30px 100px #ff6a2e77}
#url{position:absolute;left:50%;top:1300px;font-size:84px;font-weight:900;padding:34px 70px;border-radius:999px;background:linear-gradient(135deg,#ff8a4c,#ff5a2e);color:#1a0f08;box-shadow:0 30px 90px #ff6a2e77;white-space:nowrap}
#outro .s{position:absolute;left:0;right:0;top:1500px;font-size:44px;font-weight:700;color:#e7d1bf;text-align:center}
#prog{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#ff8a4c,#ff5a2e)}
#flash{background:#ff8a4c;opacity:0}
</style></head>
<body>
<div class="L" id="bg"></div>
<div class="L" id="intro"><div class="big t" id="it">Kanka Chat'te<br><span class="hot">neler var?</span></div><img id="il" src="f/logo.png"></div>
<div class="L" id="feat">
  <div id="num">01</div><div id="cnt">/ 08</div>
  <div id="title"></div><div id="sub"></div>
  <div id="card"><img id="cimg"></div>
  <div id="lvl">
    <div class="lcard" id="l0" style="top:0"><div class="ic" style="background:#ff8a4c22">⭐</div><div><h3>Seviye 11</h3><div id="xpbar"><i></i></div></div></div>
    <div class="lcard" id="l1" style="top:330px"><div class="ic" style="background:#ff5a2e22">🔥</div><div><h3>7 günlük seri</h3><p>Her gün gir, bonus XP kap</p></div></div>
    <div class="lcard" id="l2" style="top:660px"><div class="ic" style="background:#f6c44522">🖼️</div><div><h3>Profil çerçeveleri</h3><div class="frames"><b style="border-color:#c9b4a3"></b><b style="border-color:#8b7bff"></b><b style="border-color:#ff5a2e"></b><b style="border-color:#3fe0ff"></b><b style="border-color:#f6c445"></b></div></div></div>
  </div>
  <div class="dots" id="dots"></div>
</div>
<div class="L" id="outro"><div class="big t" id="ot">Hepsi<br><span class="hot">ücretsiz.</span></div><img id="ol" src="f/logo.png"><div id="url">kankahq.com</div><div class="s" id="os">VPN'siz · Türkçe · Telefon + PC</div></div>
<div class="L" id="flash"></div>
<div class="L" id="grain"></div>
<div id="prog"></div>
<script>
// [başlık html, alt yazı, görsel, kart rect {x,y,w,h}, görsel boyutu {w,h}, pan başlangıç->bitiş (x,y), telefon mu]
const F = [
 ['Sesli <span class="hot">odalar</span>', 'Tek tıkla gir, konuş. Akıllı gürültü engelleme klavye ve fan sesini siler.', 'f/oda.jpg', {x:60,y:760,w:960,h:900}, {w:1440,h:900}, [0,0],[-420,0]],
 ['Ekran <span class="hot">paylaşımı</span>', '1080p 60 FPS. Oyununu, filmini, ekranını kankalarınla paylaş.', 'f/ses.jpg', {x:60,y:760,w:960,h:900}, {w:1440,h:900}, [0,0],[-460,0]],
 ['Kendi <span class="hot">sunucun</span>', 'Kanallar, roller, izinler. Kim ne yapar, sen karar verirsin.', 'f/sunucu.png', {x:60,y:760,w:960,h:900}, {w:1507,h:900}, [0,0],[-500,0]],
 ['Kim ne <span class="hot">yapıyor?</span>', 'Ana sayfan söyler: kim seste, kim oyunda, kim yayında.', 'f/yuva.jpg', {x:60,y:760,w:960,h:900}, {w:1440,h:900}, [-200,0],[-470,0]],
 ['Maç <span class="hot">kartları</span>', 'Windows uygulaması oyununu tanır, maç bitince skorun sohbete düşer.', 'f/mac.png', {x:90,y:760,w:900,h:900}, {w:1159,h:900}, [0,0],[-240,0]],
 ['Kanka <span class="hot">Bot</span>', 'Sorunu yaz, anında cevaplasın. Yeni gelenleri de karşılar.', 'f/m1.png', {x:235,y:740,w:610,h:1000}, {w:582,h:1164}, [0,0],[0,-170], 1],
 ['Seviye ve <span class="hot">seri</span>', 'Mesaj at, her gün gir, XP topla. Seviye atladıkça yeni çerçeveler açılır.', null],
 ['Her <span class="hot">yerde</span>', 'Bilgisayarda başla, telefonda devam et. İndirme zorunlu değil.', 'f/phone.png', {x:235,y:740,w:610,h:1000}, {w:582,h:1048}, [0,0],[0,-50], 1],
];
const IN = 2.4, D = 3.6, OUT = IN + F.length * D, TOT = OUT + 4.2;
const MARKS = { pop:[], tick:[], type:[], whoosh:[], fail:[] };
MARKS.pop.push(.7); MARKS.whoosh.push(IN);
F.forEach((f,i)=>{ const a=IN+i*D; MARKS.whoosh.push(a); MARKS.pop.push(a+.35, a+.6); });
MARKS.whoosh.push(OUT); MARKS.pop.push(OUT+.5, OUT+.9, OUT+1.25);
F.forEach((_,i)=>{ if(i===6) MARKS.pop.push(IN+6*D+.9, IN+6*D+1.3, IN+6*D+1.7); });

const $ = id => document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, bk=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}, L=(a,b,x)=>a+(b-a)*x;
$('dots').innerHTML = F.map(()=>'<i></i>').join('');
let last = -1;
function setT(t){
  $('prog').style.width=(t/TOT*100)+'%';
  $('bg').style.transform=`scale(${1+.08*Math.sin(t*.8)}) translateY(${Math.sin(t*.5)*30}px)`;
  // intro
  const si = t < IN+.05; $('intro').style.display = si?'':'none';
  if (si){ const a=eo(seg(t,0,.5)), l=bk(seg(t,.6,1.05)), o=1-seg(t,IN-.3,IN);
    $('it').style.opacity=a*o; $('it').style.transform=`scale(${L(1.3,1,a)})`;
    $('il').style.opacity=seg(t,.6,.7)*o; $('il').style.transform=`scale(${L(.2,1,l)}) rotate(${L(-25,0,l)}deg)`; }
  // features
  const sf = t>=IN && t<OUT+.05; $('feat').style.display = sf?'':'none';
  if (sf){
    const i = Math.min(F.length-1, Math.floor((t-IN)/D)), a0 = IN+i*D, lt = t-a0, f = F[i];
    if (i!==last){ last=i;
      $('num').textContent = String(i+1).padStart(2,'0'); $('cnt').textContent = '/ '+String(F.length).padStart(2,'0');
      $('title').innerHTML=f[0]; $('sub').textContent=f[1];
      [...$('dots').children].forEach((d,k)=>d.className=k===i?'on':'');
      if (f[2]){ const c=$('card'), r=f[3]; c.style.display=''; $('lvl').style.display='none';
        c.className = f[7]?'phone':''; Object.assign(c.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
        const im=$('cimg'); im.src=f[2]; im.style.width=f[4].w+'px'; im.style.height=f[4].h+'px';
      } else { $('card').style.display='none'; $('lvl').style.display='block'; }
    }
    const o = 1-seg(lt,D-.28,D);
    const ti=eo(seg(lt,0,.4)); $('title').style.opacity=ti*o; $('title').style.transform=`translateX(${L(-120,0,ti)}px)`;
    const su=eo(seg(lt,.2,.6)); $('sub').style.opacity=su*o; $('sub').style.transform=`translateY(${L(30,0,su)}px)`;
    const nb=bk(seg(lt,0,.35)); $('num').style.transform=`scale(${L(.3,1,nb)})`; $('num').style.opacity=o;
    if (f[2]){ const c=eo(seg(lt,.25,.85));
      $('card').style.opacity=seg(lt,.25,.45)*o;
      $('card').style.transform=`perspective(1600px) rotateY(${L(i%2?-22:22,0,c)}deg) translateY(${L(500,0,c)}px) scale(${L(.85,1,c)*L(1,1.03,seg(lt,.85,D))})`;
      const p=eio(seg(lt,.9,D-.2)); $('cimg').style.transform=`translate(${L(f[5][0],f[6][0],p)}px,${L(f[5][1],f[6][1],p)}px)`;
    } else {
      for (let k=0;k<3;k++){ const a=.9+k*.4, e=bk(seg(lt,a,a+.35)); const el=$('l'+k); el.style.opacity=seg(lt,a,a+.1)*o; el.style.transform=`translateX(${L(k%2?-800:800,0,e)}px)`; }
      $('xpbar').firstElementChild.style.width = (75*eio(seg(lt,1.2,2.4)))+'%';
    }
  }
  // flash between
  const tf = (t-IN)%D; $('flash').style.opacity = (t>=IN && t<OUT+.3 && tf<.18) ? .35*(1-tf/.18) : 0;
  // outro
  const so = t>=OUT; $('outro').style.display = so?'':'none';
  if (so){ const lt=t-OUT; const a=eo(seg(lt,0,.45)), l=bk(seg(lt,.4,.8)), u=bk(seg(lt,.8,1.15));
    const pulse = lt>1.3 ? 1+.035*Math.max(0,Math.sin((lt-1.3)*5.5)) : 1;
    $('ot').style.opacity=a; $('ot').style.transform=`scale(${L(1.3,1,a)})`;
    $('ol').style.opacity=seg(lt,.4,.5); $('ol').style.transform=`scale(${L(.3,1,l)}) translateY(${Math.sin(t*2)*8}px)`;
    $('url').style.opacity=seg(lt,.8,.9); $('url').style.transform=`translateX(-50%) scale(${L(.5,1,u)*pulse})`;
    $('os').style.opacity=seg(lt,1.3,1.7); }
}
setT(0);
</script>
</body></html>
