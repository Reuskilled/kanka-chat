<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0b09;font-family:'Inter Display','Inter','Poppins',sans-serif;color:#f9efe4}
.L{position:absolute;inset:0}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#bgglow{background:radial-gradient(900px 900px at 50% 40%,#ff8a4c40,transparent 65%),radial-gradient(700px 700px at 80% 85%,#ff5a2e30,transparent 60%)}
#grain{opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.big{font-weight:900;letter-spacing:-4px;line-height:.95;text-align:center;text-transform:uppercase}
.hot{background:linear-gradient(120deg,#ffc08f,#ff8a4c 45%,#ff5a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
/* S1 */
#vpnCard{width:760px;padding:44px;border-radius:40px;background:#1c1512;border:2px solid #3a2c24;box-shadow:0 40px 120px #000a}
#vpnCard .row{display:flex;align-items:center;gap:26px;font-size:44px;font-weight:800}
#spin{width:64px;height:64px;border-radius:50%;border:8px solid #4a3a30;border-top-color:#ff8a4c}
#vpnBar{height:18px;border-radius:9px;background:#2d221c;margin-top:36px;overflow:hidden}
#vpnBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a4c,#ff5a2e);border-radius:9px}
#fail{margin-top:30px;display:inline-flex;gap:14px;align-items:center;font-size:38px;font-weight:800;color:#ff6b6b;background:#ff4d4d1a;border:2px solid #ff4d4d66;padding:14px 26px;border-radius:999px}
#q1{top:420px;font-size:120px}
/* S2 */
#flash{background:#ff8a4c}
#logo{width:340px;height:340px;border-radius:90px;box-shadow:0 30px 120px #ff6a2e88}
#word{font-size:150px;top:1250px}
#birak{font-size:96px;top:640px}
/* phone / screens */
.phone{width:620px;border-radius:70px;overflow:hidden;border:14px solid #2a201b;box-shadow:0 60px 140px #000c,0 0 0 2px #4a3a30}
.phone img{width:100%;display:block}
.cap{left:60px;right:60px;top:210px;font-size:92px}
.chip{position:absolute;background:#241b17ee;border:2px solid #4a3a30;border-radius:34px;padding:24px 30px;display:flex;align-items:center;gap:20px;font-size:38px;font-weight:800;box-shadow:0 30px 70px #000b;white-space:nowrap}
.chip small{display:block;font-size:28px;color:#c9b4a3;font-weight:700}
.chip .av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px}
.win{position:absolute;border-radius:28px;overflow:hidden;border:3px solid #4a3a30;box-shadow:0 60px 140px #000c;background:#17110e}
.win img{display:block;height:100%}
/* stamps */
.stamp{position:absolute;left:90px;right:90px;height:210px;border-radius:44px;display:flex;align-items:center;gap:34px;padding:0 50px;font-size:76px;white-space:nowrap;font-weight:900;letter-spacing:-2px;text-transform:uppercase;background:#1f1713;border:3px solid #3a2c24}
.stamp b{width:120px;height:120px;border-radius:34px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#ff8a4c,#ff5a2e);color:#1a0f08;flex:none}
/* CTA */
#url{font-size:84px;font-weight:900;padding:34px 70px;border-radius:999px;background:linear-gradient(135deg,#ff8a4c,#ff5a2e);color:#1a0f08;box-shadow:0 30px 90px #ff6a2e77;white-space:nowrap}
#ctaT{top:560px;font-size:130px}
#ctaS{top:1430px;white-space:nowrap;font-size:46px;font-weight:700;color:#e7d1bf;letter-spacing:0;text-transform:none}
#prog{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#ff8a4c,#ff5a2e)}
</style></head>
<body>
<div class="L" id="bgglow"></div>

<!-- S1 hook -->
<div class="L" id="s1">
  <div class="c big" id="q1">Hâlâ <span class="hot">VPN</span><br>mi arıyorsun?</div>
  <div class="c" id="vpnCard" style="top:1120px">
    <div class="row"><div id="spin"></div><span id="vpnTxt">Bağlanıyor…</span></div>
    <div id="vpnBar"><i></i></div>
    <div id="fail">✕ Bağlantı başarısız</div>
  </div>
</div>

<!-- S2 logo -->
<div class="L" id="flash"></div>
<div class="L" id="s2">
  <div class="c big" id="birak">Bırak onu.</div>
  <img class="c" id="logo" src="f/logo.png">
  <div class="c big" id="word">Kanka <span class="hot">Chat</span></div>
</div>

<!-- S3 phone -->
<div class="L" id="s3">
  <div class="c big cap" id="cap3" style="transform:none">Tek tıkla<br><span class="hot">sesli odaya</span> gir</div>
  <div class="c phone" id="ph" style="top:1230px"><img src="f/phone.png"></div>
  <div class="chip" id="ch1" style="left:40px;top:1050px"><div class="av" style="background:#3fcf8e30">🎧</div><div>Oyun Odası 1<small>4 kişi seste</small></div></div>
  <div class="chip" id="ch2" style="right:40px;top:1420px"><div class="av" style="background:#ff8a4c30">🔥</div><div>Elif yayında<small>3 izleyen</small></div></div>
</div>

<!-- S4 desktop -->
<div class="L" id="s4">
  <div class="c big cap" id="cap4" style="transform:none"></div>
  <div class="win" id="w1" style="left:50px;top:640px;width:980px;height:1000px"><img id="w1i" src="f/ses.jpg"></div>
</div>

<!-- S5 stamps -->
<div class="L" id="s5">
  <div class="c big cap" id="cap5" style="transform:none;top:230px">Hepsi<br><span class="hot">bedava.</span></div>
  <div class="stamp" id="st0" style="top:720px"><b>✓</b>VPN yok</div>
  <div class="stamp" id="st1" style="top:970px"><b>✓</b>Ücretsiz</div>
  <div class="stamp" id="st2" style="top:1220px"><b>✓</b>%100 Türkçe</div>
  <div class="stamp" id="st3" style="top:1470px"><b>✓</b>Telefon + PC</div>
</div>

<!-- S6 CTA -->
<div class="L" id="s6">
  <div class="c big" id="ctaT">Kankaların<br><span class="hot">seni bekliyor</span></div>
  <img class="c" id="logo2" src="f/logo.png" style="width:240px;height:240px;border-radius:64px;top:1000px;box-shadow:0 30px 100px #ff6a2e77">
  <div class="c" id="url" style="top:1260px">kankahq.com</div>
  <div class="c big" id="ctaS">Ücretsiz katıl · 30 saniyede hesap</div>
</div>

<div class="L" id="grain"></div>
<div id="prog"></div>

<script>
const TOT = 21.5;
const MARKS = { pop:[2.25,3.45,4.0,6.0,6.35,15.0,15.85,16.55,17.15,18.55], tick:[1.0,1.3,1.6,1.9], type:[], whoosh:[3.2,5.4,9.3,12.2,14.5,17.85], fail:[2.2] };
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
const seg = (t,a,b) => cl((t-a)/(b-a));
const eo = x => 1-Math.pow(1-x,3);
const eio = x => x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bk = x => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const L = (a,b,x) => a+(b-a)*x;
function vis(el, on){ el.style.display = on ? '' : 'none'; }
function st(el, o, tr){ el.style.opacity = o; if (tr !== undefined) el.style.transform = tr; }
const C = 'translate(-50%,-50%) ';

function setT(t){
  $('prog').style.width = (t/TOT*100)+'%';
  // S1 0-3.2
  const s1 = t < 3.25; vis($('s1'), s1);
  if (s1){
    const a = eo(seg(t,0,.45)); st($('q1'), a, C+`scale(${L(1.3,1,a)})`);
    const c = bk(seg(t,.35,.8)); const shake = t>2.2&&t<2.6 ? Math.sin(t*90)*16*(1-seg(t,2.2,2.6)) : 0;
    st($('vpnCard'), seg(t,.35,.6), `translate(calc(-50% + ${shake}px),-50%) scale(${L(.85,1,c)})`);
    $('spin').style.transform = `rotate(${t*520}deg)`; $('spin').style.borderTopColor = t>2.2 ? '#ff4d4d' : '#ff8a4c';
    $('vpnBar').firstElementChild.style.width = (t<2.2 ? 92*eio(seg(t,.6,2.15)) : 92) + '%';
    $('vpnBar').firstElementChild.style.background = t>2.2 ? '#ff4d4d' : '';
    $('vpnTxt').textContent = t<2.2 ? 'Bağlanıyor…' : 'Olmadı yine';
    const f = bk(seg(t,2.2,2.5)); st($('fail'), seg(t,2.2,2.35), `scale(${L(.6,1,f)})`);
    const out = seg(t,2.95,3.25); $('s1').style.opacity = 1-out; $('s1').style.filter = `blur(${out*20}px)`;
  }
  // flash
  $('flash').style.opacity = t>3.2&&t<3.6 ? 1-seg(t,3.2,3.6) : 0;
  // S2 3.2-5.5
  const s2 = t>=3.2 && t<5.55; vis($('s2'), s2);
  if (s2){
    const b = bk(seg(t,3.35,3.7)); st($('birak'), seg(t,3.3,3.45)*(1-seg(t,5.25,5.5)), C+`scale(${L(1.6,1,b)})`);
    const l = bk(seg(t,3.9,4.35)); st($('logo'), seg(t,3.9,4.05)*(1-seg(t,5.25,5.5)), C+`scale(${L(.2,1,l)}) rotate(${L(-25,0,l)}deg)`);
    const w = eo(seg(t,4.15,4.6)); st($('word'), w*(1-seg(t,5.25,5.5)), C+`translateY(${L(80,0,w)}px)`);
  }
  // S3 5.5-9.4 phone
  const s3 = t>=5.45 && t<9.45; vis($('s3'), s3);
  if (s3){
    const o = 1-seg(t,9.15,9.45);
    const c = eo(seg(t,5.5,6.0)); st($('cap3'), c*o, `translateY(${L(-60,0,c)}px)`);
    const p = eo(seg(t,5.55,6.3)); st($('ph'), o, C+`translateY(${L(900,0,p)}px) rotate(${L(8,-2,p)+Math.sin(t*1.6)*1.2}deg) scale(${L(1,1.04,seg(t,6.3,9.4))})`);
    const k1 = bk(seg(t,6.0,6.35)), k2 = bk(seg(t,6.35,6.7));
    st($('ch1'), seg(t,6.0,6.1)*o, `scale(${L(.4,1,k1)}) translateY(${Math.sin(t*2.2)*10}px)`);
    st($('ch2'), seg(t,6.35,6.45)*o, `scale(${L(.4,1,k2)}) translateY(${Math.sin(t*2.2+1)*10}px)`);
  }
  // S4 9.3-14.7 desktop: two shots
  const s4 = t>=9.3 && t<14.75; vis($('s4'), s4);
  if (s4){
    const second = t >= 12.2;
    $('w1i').src = second ? 'f/yuva.jpg' : 'f/ses.jpg';
    $('cap4').innerHTML = second ? 'Kendi<br><span class="hot">sunucunu</span> kur' : 'Ekranını<br><span class="hot">paylaş,</span> beraber izle';
    const a0 = second ? 12.2 : 9.3, a1 = second ? 14.75 : 12.2;
    const i = eo(seg(t,a0,a0+.45)), o = second ? 1-seg(t,14.45,14.75) : 1-seg(t,11.95,12.2);
    st($('cap4'), i*o, `translateY(${L(-60,0,i)}px)`);
    // pan inside screenshot (image 1400 wide scaled to 600 tall => ~960*? ) : slow Ken Burns
    const img = $('w1i'); img.style.height = '1000px'; img.style.transform = `translateX(${L(0,-(1600-980)*.9,seg(t,a0,a1))}px) scale(${L(1.0,1.08,seg(t,a0,a1))})`; img.style.transformOrigin = 'left center';
    const w = eo(seg(t,a0,a0+.5));
    st($('w1'), o, `perspective(1600px) rotateY(${L(second?-25:25,second?4:-4,w)}deg) translateY(${L(400,0,w)}px) scale(${L(.8,1.04,w)})`);
  }
  // S5 14.6-17.5 stamps
  const s5 = t>=14.6 && t<18.1; vis($('s5'), s5);
  if (s5){
    const o = 1-seg(t,17.8,18.1);
    const c = eo(seg(t,14.6,15.0)); st($('cap5'), c*o, `scale(${L(1.25,1,c)})`);
    for (let k=0;k<4;k++){ const a = [15.0,15.85,16.55,17.15][k], e = bk(seg(t,a,a+.32)); st($('st'+k), seg(t,a,a+.08)*o, `translateX(${L(k%2?-700:700,0,e)}px) rotate(${L(k%2?-6:6,0,e)}deg)`); }
  }
  // S6 17.85-21 CTA
  const s6 = t>=17.85; vis($('s6'), s6);
  if (s6){
    const a = eo(seg(t,17.90,18.35)); st($('ctaT'), a, C+`translateY(${L(-80,0,a)}px)`);
    const l = bk(seg(t,18.15,18.55)); st($('logo2'), seg(t,18.15,18.25), C+`scale(${L(.3,1,l)}) translateY(${Math.sin(t*2)*8}px)`);
    const u = bk(seg(t,18.55,18.90)); const pulse = 1+.035*Math.max(0,Math.sin((t-18.95)*5.5))*(t>18.95?1:0);
    st($('url'), seg(t,18.55,18.65), C+`scale(${L(.5,1,u)*pulse})`);
    st($('ctaS'), seg(t,19.05,19.45), C);
  }
  $('bgglow').style.transform = `scale(${1+.08*Math.sin(t*.8)}) translateY(${Math.sin(t*.5)*30}px)`;
}
setT(0);
</script>
</body></html>
